        if(ef) doc.imgEnemy  = await toB64(ef);
        if(xf) doc.imgExit   = await toB64(xf);
      } else if(type==='runner'){
        const pf=document.getElementById('agRunnerPlayer').files[0];
        const of=document.getElementById('agRunnerObstacle').files[0];
        const bf=document.getElementById('agRunnerBg').files[0];
        if(pf) doc.imgPlayer=await toB64(pf);
        if(of) doc.imgObstacle=await toB64(of);
        if(bf) doc.imgBg=await toB64(bf);
      } else if(type==='shooter'){
        const gf=document.getElementById('agShotGoalkeeper').files[0];
        const sf=document.getElementById('agShotShooter').files[0];
        if(gf) doc.imgGoalkeeper=await toB64(gf);
        if(sf) doc.imgShooter=await toB64(sf);
        doc.shotCount=parseInt(document.getElementById('agShotCount').value,10)||5;
      } else if(type==='memory'){
        const files=document.getElementById('agMemoryCards').files;
        if(!files.length){ msg.textContent='Importe au moins 4 images.'; btn.disabled=false; btn.textContent='Créer le mini-jeu'; return; }
        doc.cards = await filesToB64(files, GIF_LIMIT_MULTI);
      } else if(type==='silhouette'){
        const names = document.getElementById('agSilNames').value.split('\n').map(s=>s.trim()).filter(Boolean);
        const imgs = await filesToB64(document.getElementById('agSilImages').files, GIF_LIMIT_MULTI);
        if(!names.length||!imgs.length){ msg.textContent='Ajoute des noms et des images.'; btn.disabled=false; btn.textContent='Créer le mini-jeu'; return; }
        doc.questions = names.map((n,i)=>({name:n, img:imgs[i]||imgs[0]}));
        doc.timePerQ = parseInt(document.getElementById('agSilTime').value,10)||10;
      } else if(type==='sequence'){
        doc.seqMax = parseInt(document.getElementById('agSeqMax').value,10)||8;
        doc.seqImages = await filesToB64(document.getElementById('agSeqImages').files, GIF_LIMIT_MULTI);
      } else if(type==='dodge'){
        const pf=document.getElementById('agDodgePlayer').files[0];
        const of=document.getElementById('agDodgeObstacle').files[0];
        const bf=document.getElementById('agDodgeBg').files[0];
        if(pf) doc.imgPlayer=await toB64(pf);
        if(of) doc.imgObstacle=await toB64(of);
        if(bf) doc.imgBg=await toB64(bf);
      } else if(type==='quiz'){
        const lines = document.getElementById('agQuizData').value.split('\n').map(l=>l.trim()).filter(Boolean);
        const questions=[];
        for(const l of lines){
          const p=l.split('|').map(s=>s.trim());
          if(p.length<6) continue;
          questions.push({q:p[0],choices:[p[1],p[2],p[3],p[4]],correct:Math.max(0,parseInt(p[5],10)-1)});
        }
        if(!questions.length){ msg.textContent='Ajoute au moins une question.'; btn.disabled=false; btn.textContent='Créer le mini-jeu'; return; }
        doc.questions = questions;
        doc.quizImages = await filesToB64(document.getElementById('agQuizImages').files, GIF_LIMIT_MULTI);
      } else if(type==='custom'){
        const pf = document.getElementById('agCPlayerImg').files[0];
        if(pf) doc.cPlayerImg = await toB64(pf);
        doc.cPlayerMode = document.getElementById('agCPlayerMode').value;
        doc.cPlayerSpeed = parseInt(document.getElementById('agCPlayerSpeed').value,10)||5;
        doc.cLives = parseInt(document.getElementById('agCLives').value,10)||0;
        doc.cWinScore = parseInt(document.getElementById('agCWinScore').value,10)||0;
        doc.cDuration = parseInt(document.getElementById('agCDuration').value,10)||0;
        const bgf = document.getElementById('agCBg').files[0];
        if(bgf) doc.cBg = await toB64(bgf, GIF_LIMIT_MULTI);
        const rows = Array.from(document.getElementById('agCEntities').children);
        if(!rows.length){ msg.textContent='Ajoute au moins un élément.'; btn.disabled=false; btn.textContent='Créer le mini-jeu'; return; }
        const entities = [];
        for(const row of rows){
          const id = row.dataset.entId;
          const f = document.getElementById(id+'img').files[0];
          if(!f) continue;
          entities.push({
            img: await toB64(f, GIF_LIMIT_MULTI),
            behavior: document.getElementById(id+'behavior').value,
            speed: parseInt(document.getElementById(id+'speed').value,10)||4,
            rate: parseFloat(document.getElementById(id+'rate').value)||2,
            size: parseInt(document.getElementById(id+'size').value,10)||32,
            effect: document.getElementById(id+'effect').value
          });
        }
        if(!entities.length){ msg.textContent='Chaque élément a besoin d\'une image.'; btn.disabled=false; btn.textContent='Créer le mini-jeu'; return; }
        doc.cEntities = entities;
      }
      await db.collection('communities').doc(slug).collection('games').add(doc);
      toast('Mini-jeu créé !');
      area.innerHTML='';
      onDone();
    }catch(e){ msg.textContent='Erreur : '+e.message; btn.disabled=false; btn.textContent='Créer le mini-jeu'; }
  };
}

/* ================================================================
   MOTEURS DE JEU (canvas-based)
   ================================================================ */

/* ---- 1. LABYRINTHE ---- */
/* ================================================================
   DÉCODEUR GIF89a MAISON + SPRITES ANIMÉS POUR CANVAS
   (les <canvas> ne jouent jamais l'animation d'un GIF nativement —
   on décode donc les frames nous-mêmes pour les faire défiler)
   ================================================================ */
function lzwDecodeGif(minCodeSize, data, pixelCount){
  const clearCode = 1 << minCodeSize;
  const eoiCode = clearCode + 1;
  let codeSize, dict;
  function resetDict(){
    dict = [];
    for(let i=0;i<clearCode;i++) dict[i]=[i];
    dict[clearCode]=-1; dict[eoiCode]=-1;
    codeSize = minCodeSize+1;
  }
  resetDict();
  const output = new Uint8Array(pixelCount);
  let outPos=0, bitBuf=0, bitCnt=0, bytePos=0;
  function readCode(){
    while(bitCnt<codeSize){
      if(bytePos>=data.length) return eoiCode;
      bitBuf |= data[bytePos++] << bitCnt;
      bitCnt += 8;
    }
    const code = bitBuf & ((1<<codeSize)-1);
    bitBuf >>= codeSize; bitCnt -= codeSize;
    return code;
  }
  let prev=null, code;
  while((code=readCode())!==eoiCode){
    if(outPos>=pixelCount) break;
    if(code===clearCode){ resetDict(); prev=null; continue; }
    let entry;
    if(code < dict.length && dict[code]!==-1) entry = dict[code];
    else if(code===dict.length && prev) entry = prev.concat([prev[0]]);
    else break;
    for(let i=0;i<entry.length && outPos<pixelCount;i++) output[outPos++]=entry[i];
    if(prev){
      dict.push(prev.concat([entry[0]]));
      if(dict.length===(1<<codeSize) && codeSize<12) codeSize++;
    }
    prev = entry;
  }
  return output;
}

function parseGifFrames(buffer){
  let p = 0;
  function rb(){ return buffer[p++]; }
  function ru16(){ const v = buffer[p] | (buffer[p+1]<<8); p+=2; return v; }
  const sig = String.fromCharCode(rb(),rb(),rb(),rb(),rb(),rb());
  if(sig.slice(0,3)!=='GIF') throw new Error('not a gif');
  const screenW = ru16(), screenH = ru16();
  const packed = rb();
  const gctFlag = !!(packed & 0x80);
  const gctSize = 2 << (packed & 0x07);
  rb(); rb(); // bg color index, aspect ratio
  let gct = null;
  if(gctFlag){ gct=[]; for(let i=0;i<gctSize;i++) gct.push([rb(),rb(),rb()]); }

  const frames = [];
  let gce = null, prevDisposal = 0, prevRect = null;
  const baseCanvas = document.createElement('canvas');
  baseCanvas.width = screenW; baseCanvas.height = screenH;
  const baseCtx = baseCanvas.getContext('2d');

  while(p < buffer.length){
    const blockType = rb();
    if(blockType === 0x21){
      const label = rb();
      if(label === 0xF9){
        rb();
        const pk = rb();
        const delay = ru16();
        const transIdx = rb();
        rb();
        gce = { disposal:(pk>>2)&7, transparent:!!(pk&1), delay:(delay||10)*10, transIdx };
      } else {
        let sz; while((sz=rb())!==0) p+=sz;
      }
    } else if(blockType === 0x2C){
      const left=ru16(), top=ru16(), w=ru16(), h=ru16();
      const pk = rb();
      const lctFlag = !!(pk&0x80);
      const interlaced = !!(pk&0x40);
      const lctSize = 2 << (pk&0x07);
      let lct=null;
      if(lctFlag){ lct=[]; for(let i=0;i<lctSize;i++) lct.push([rb(),rb(),rb()]); }
      const minCodeSize = rb();
      let dataBytes=[]; let sz;
      while((sz=rb())!==0){ for(let i=0;i<sz;i++) dataBytes.push(rb()); }
      const table = lct || gct || [[0,0,0]];
      const indices = lzwDecodeGif(minCodeSize, dataBytes, w*h);

      if(prevRect && prevDisposal===2){ baseCtx.clearRect(prevRect.left, prevRect.top, prevRect.w, prevRect.h); }

      let rows = [];
      if(interlaced){
        for(let y=0;y<h;y+=8) rows.push(y);
        for(let y=4;y<h;y+=8) rows.push(y);
        for(let y=2;y<h;y+=4) rows.push(y);
        for(let y=1;y<h;y+=2) rows.push(y);
      } else { for(let y=0;y<h;y++) rows.push(y); }

      const frameImgData = baseCtx.createImageData(w,h);
      let srcPos=0;
      for(const y of rows){
        for(let x=0;x<w;x++){
          const ci = indices[srcPos++];
          const di=(y*w+x)*4;
          if(gce && gce.transparent && ci===gce.transIdx){ frameImgData.data[di+3]=0; }
          else{ const c=table[ci]||[0,0,0]; frameImgData.data[di]=c[0]; frameImgData.data[di+1]=c[1]; frameImgData.data[di+2]=c[2]; frameImgData.data[di+3]=255; }
        }
      }
      const tmp = document.createElement('canvas'); tmp.width=w; tmp.height=h;
      tmp.getContext('2d').putImageData(frameImgData,0,0);
      baseCtx.drawImage(tmp, left, top);

      const snap = document.createElement('canvas'); snap.width=screenW; snap.height=screenH;
      snap.getContext('2d').drawImage(baseCanvas,0,0);
      frames.push({canvas:snap, delay: gce?gce.delay:100});

      prevDisposal = gce ? gce.disposal : 0;
      prevRect = {left, top, w, h};
      gce = null;
    } else if(blockType === 0x3B || isNaN(blockType)){ break; }
    else { break; }
  }
  return frames;
}

/** Charge une image (statique ou GIF animé) et renvoie un "sprite" utilisable
 *  avec spriteDraw() sur un canvas. Ne casse jamais : bascule sur image
 *  statique si le décodage GIF échoue pour une raison quelconque. */
function loadSprite(src){
  const sprite = { complete:false, _static:null, _gifFrames:null, _gifStart:0, _gifTotal:0 };
  if(!src) return sprite;
  function fallbackStatic(){
    const img = new Image();
    img.onload = ()=>{ sprite.complete = true; };
    img.src = src;
    sprite._static = img;
  }
  if(/^data:image\/gif/i.test(src)){
    try{
      const b64 = src.split(',')[1];
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
      const frames = parseGifFrames(bytes);
      if(frames && frames.length>1){
        sprite._gifFrames = frames;
        sprite._gifTotal = frames.reduce((s,f)=>s+f.delay,0) || frames.length*100;
        sprite._gifStart = performance.now();
        sprite.complete = true;
      } else fallbackStatic();
    }catch(e){ fallbackStatic(); }
  } else fallbackStatic();
  sprite.currentSource = function(){
    if(this._gifFrames){
      const elapsed = (performance.now() - this._gifStart) % this._gifTotal;
      let acc=0;
      for(const f of this._gifFrames){ acc+=f.delay; if(elapsed<acc) return f.canvas; }
      return this._gifFrames[this._gifFrames.length-1].canvas;
    }
    return this._static;
  };
  return sprite;
}
function spriteDraw(ctx, sprite, x, y, w, h){
  if(!sprite || !sprite.complete) return;
  const src = sprite.currentSource();
  if(src) ctx.drawImage(src, x, y, w, h);
}

function playMazeGame(area, slug, g){
  const SIZE = g.mazeSize||10, CELL=Math.min(32, Math.floor(320/SIZE));
  const W=SIZE*CELL, H=SIZE*CELL;
  area.innerHTML=`<div style="margin-top:8px;text-align:center;">
    <div id="mazeInfo" class="post-meta" style="margin-bottom:6px;">Trouve la sortie 🚪 — évite les ennemis !</div>
    <canvas id="mazeCanvas" width="${W}" height="${H}" style="border:2px solid var(--border);border-radius:8px;touch-action:none;"></canvas>
    <div style="margin-top:6px;" class="post-meta">Flèches / ZQSD ou swipe</div>
  </div>`;
  const canvas=document.getElementById('mazeCanvas'), ctx=canvas.getContext('2d');
  // génération labyrinthe par DFS
  const grid=[];
  for(let y=0;y<SIZE;y++){ grid[y]=[]; for(let x=0;x<SIZE;x++) grid[y][x]={n:true,s:true,e:true,w:true,visited:false}; }
  function carve(x,y){
    grid[y][x].visited=true;
    const dirs=[['n',0,-1],['s',0,1],['e',1,0],['w',-1,0]].sort(()=>Math.random()-.5);
    for(const[d,dx,dy] of dirs){
      const nx=x+dx,ny=y+dy;
      if(nx<0||ny<0||nx>=SIZE||ny>=SIZE||grid[ny][nx].visited) continue;
      grid[y][x][d]=false;
      const opp={n:'s',s:'n',e:'w',w:'e'}[d];
      grid[ny][nx][opp]=false;
      carve(nx,ny);
    }
  }
  carve(0,0);
  let player={x:0,y:0}, startMs=Date.now(), alive=true;
  const exit={x:SIZE-1,y:SIZE-1};
  const speedMs={slow:600,normal:350,fast:180}[g.mazeSpeed||'normal'];
  const enemies=[];
  for(let i=0;i<(g.mazeEnemies||0);i++){
    let ex,ey;
    do{ ex=Math.floor(Math.random()*SIZE); ey=Math.floor(Math.random()*SIZE); }
    while(ex===0&&ey===0 || ex===SIZE-1&&ey===SIZE-1);
    enemies.push({x:ex,y:ey});
  }
  // chargement images
  function loadImg(src){ return loadSprite(src); }
  const imgP=loadImg(g.imgPlayer), imgE=loadImg(g.imgEnemy), imgX=loadImg(g.imgExit);
  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='#f5f6fa'; ctx.fillRect(0,0,W,H);
    // cellules
    ctx.strokeStyle='#334'; ctx.lineWidth=2;
    for(let y=0;y<SIZE;y++) for(let x=0;x<SIZE;x++){
      const c=grid[y][x], px=x*CELL, py=y*CELL;
      if(c.n){ ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(px+CELL,py); ctx.stroke(); }
      if(c.s){ ctx.beginPath(); ctx.moveTo(px,py+CELL); ctx.lineTo(px+CELL,py+CELL); ctx.stroke(); }
      if(c.w){ ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(px,py+CELL); ctx.stroke(); }
      if(c.e){ ctx.beginPath(); ctx.moveTo(px+CELL,py); ctx.lineTo(px+CELL,py+CELL); ctx.stroke(); }
    }
    // sortie
    const xp=exit.x*CELL+2, yp=exit.y*CELL+2, xs=CELL-4;
    if(imgX&&imgX.complete) spriteDraw(ctx,imgX,xp,yp,xs,xs);
    else{ ctx.fillStyle='#22c55e'; ctx.fillRect(xp,yp,xs,xs); ctx.fillStyle='#fff'; ctx.font=`${xs*.7}px serif`; ctx.fillText('🚪',xp,yp+xs*.85); }
    // ennemis
    enemies.forEach(e=>{
      const ep=e.x*CELL+2, ey2=e.y*CELL+2, es=CELL-4;
      if(imgE&&imgE.complete) spriteDraw(ctx,imgE,ep,ey2,es,es);
      else{ ctx.fillStyle='#ef4444'; ctx.fillRect(ep,ey2,es,es); }
    });
    // joueur
    const pp=player.x*CELL+2, py2=player.y*CELL+2, ps=CELL-4;
    if(imgP&&imgP.complete) spriteDraw(ctx,imgP,pp,py2,ps,ps);
    else{ ctx.fillStyle='#4f46e5'; ctx.fillRect(pp,py2,ps,ps); }
  }
  function tryMove(dx,dy){
    if(!alive) return;
    const c=grid[player.y][player.x];
    const blocked=(dx===1&&c.e)||(dx===-1&&c.w)||(dy===1&&c.s)||(dy===-1&&c.n);
    if(blocked) return;
    player.x+=dx; player.y+=dy;
    checkState();
    draw();
  }
  function moveEnemy(e){
    const dirs=[[0,-1],[0,1],[1,0],[-1,0]].filter(([dx,dy])=>{
      const c=grid[e.y][e.x];
      return !((dx===1&&c.e)||(dx===-1&&c.w)||(dy===1&&c.s)||(dy===-1&&c.n));
    }).sort(()=>Math.random()-.5);
    if(dirs.length){ e.x+=dirs[0][0]; e.y+=dirs[0][1]; }
  }
  function checkState(){
    if(enemies.some(e=>e.x===player.x&&e.y===player.y)){
      alive=false;
      document.getElementById('mazeInfo').textContent='💀 Touché par un ennemi ! Recharge pour rejouer.';
      return;
    }
    if(player.x===exit.x&&player.y===exit.y){
      alive=false;
      const secs=Math.round((Date.now()-startMs)/1000);
      document.getElementById('mazeInfo').textContent='🎉 Sorti en '+secs+'s !';
      submitGameScore(slug,g,secs);
      return;
    }
    if(g.mazeDuration>0){
      const elapsed=(Date.now()-startMs)/1000;
      const left=Math.max(0,Math.ceil(g.mazeDuration-elapsed));
      const info=document.getElementById('mazeInfo');
      if(info) info.textContent='⏱️ '+left+'s restantes — trouve la sortie 🚪 !';
      if(elapsed>=g.mazeDuration){
        alive=false;
        if(info) info.textContent="⏰ Temps écoulé ! Recharge pour rejouer.";
      }
    }
  }
  const enemyInterval = setInterval(()=>{
    if(!alive||!document.getElementById('mazeCanvas')){ clearInterval(enemyInterval); return; }
    enemies.forEach(moveEnemy);
    checkState();
    draw();
  }, speedMs);
  document.addEventListener('keydown', function kh(e){
    if(!document.getElementById('mazeCanvas')){ document.removeEventListener('keydown',kh); return; }
    const map={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],z:[0,-1],s:[0,1],q:[-1,0],d:[1,0],Z:[0,-1],S:[0,1],Q:[-1,0],D:[1,0]};
    if(map[e.key]){ e.preventDefault(); tryMove(...map[e.key]); }
  });
  let tx=0,ty=0;
  canvas.addEventListener('touchstart',e=>{ tx=e.touches[0].clientX; ty=e.touches[0].clientY; },{passive:true});
  canvas.addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
    if(Math.abs(dx)>Math.abs(dy)) tryMove(dx>0?1:-1,0); else tryMove(0,dy>0?1:-1);
  },{passive:true});
  draw();
}

/* ---- 2. RUNNER ---- */
function playRunnerGame(area, slug, g){
  const W=360,H=180;
  area.innerHTML=`<div style="margin-top:8px;text-align:center;">
    <canvas id="runCanvas" width="${W}" height="${H}" style="border:2px solid var(--border);border-radius:8px;touch-action:none;max-width:100%;"></canvas>
    <div class="post-meta" style="margin-top:4px;">Espace / Tap pour sauter</div>
  </div>`;
  const canvas=document.getElementById('runCanvas'),ctx=canvas.getContext('2d');
  const GND=H-40;
  function loadImg(src){ return loadSprite(src); }
  const imgP=loadImg(g.imgPlayer),imgO=loadImg(g.imgObstacle),imgBg=loadImg(g.imgBg);
  let player={x:50,y:GND,w:32,h:32,vy:0,onGround:true};
  let obstacles=[],score=0,speed=3,alive=true,frame=0,bgX=0;
  function jump(){ if(player.onGround){ player.vy=-10; player.onGround=false; } }
  document.addEventListener('keydown',function kh(e){ if(!document.getElementById('runCanvas')){document.removeEventListener('keydown',kh);return;} if(e.code==='Space'){e.preventDefault();jump();} });
  canvas.addEventListener('click',jump); canvas.addEventListener('touchstart',()=>jump(),{passive:true});
  function update(){
    if(!alive) return;
    frame++; score++;
    if(frame%60===0) speed+=0.2;
    // BG
    bgX=(bgX-speed*.3+W)%W;
    // player gravity
    player.vy+=0.6; player.y+=player.vy;
    if(player.y>=GND){ player.y=GND; player.vy=0; player.onGround=true; }
    // spawn obstacle
    if(frame%Math.max(50,90-score/100)===0) obstacles.push({x:W,y:GND,w:24,h:24+Math.random()*20});
    obstacles.forEach(o=> o.x-=speed);
    obstacles=obstacles.filter(o=>o.x>-50);
    // collision
    if(obstacles.some(o=> player.x+4<o.x+o.w && player.x+player.w-4>o.x && player.y+4<o.y+o.h && player.y+player.h>o.y+4)){
      alive=false;
      submitGameScore(slug,g,score);
    }
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    if(imgBg&&imgBg.complete){ spriteDraw(ctx,imgBg,bgX-W,0,W,H); spriteDraw(ctx,imgBg,bgX,0,W,H); }
    else{ ctx.fillStyle='#e0e7ff'; ctx.fillRect(0,0,W,H); }
    // sol
    ctx.fillStyle='#6b7280'; ctx.fillRect(0,GND+32,W,8);
    // obstacles
    obstacles.forEach(o=>{
      if(imgO&&imgO.complete) spriteDraw(ctx,imgO,o.x,o.y,o.w,o.h);
      else{ ctx.fillStyle='#ef4444'; ctx.fillRect(o.x,o.y,o.w,o.h); }
    });
    // player
    if(imgP&&imgP.complete) spriteDraw(ctx,imgP,player.x,player.y,player.w,player.h);
    else{ ctx.fillStyle='#4f46e5'; ctx.fillRect(player.x,player.y,player.w,player.h); }
    // score
    ctx.fillStyle='#1e1b4b'; ctx.font='bold 14px sans-serif'; ctx.fillText('Score : '+score,8,18);
    if(!alive){
      ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#fff'; ctx.font='bold 20px sans-serif'; ctx.textAlign='center';
      ctx.fillText('Score final : '+score+' pts',W/2,H/2);
      ctx.font='13px sans-serif'; ctx.fillText('Clique sur ▶ Jouer pour rejouer',W/2,H/2+24);
      ctx.textAlign='left';
    }
  }
  let raf;
  function loop(){ draw(); if(alive) raf=requestAnimationFrame(()=>{ update(); loop(); }); }
  loop();
}

/* ---- 3. PENALTY SHOOTOUT ---- */
function playShooterGame(area, slug, g){
  const W=320,H=200, total=g.shotCount||5;
  area.innerHTML=`<div style="margin-top:8px;text-align:center;">
    <canvas id="shotCanvas" width="${W}" height="${H}" style="border:2px solid var(--border);border-radius:8px;max-width:100%;cursor:crosshair;"></canvas>
    <div class="post-meta" style="margin-top:4px;">Clique dans le but pour tirer — <span id="shotInfo">${total} tirs restants</span></div>
  </div>`;
  const canvas=document.getElementById('shotCanvas'),ctx=canvas.getContext('2d');
  function loadImg(src){ return loadSprite(src); }
  const imgGK=loadImg(g.imgGoalkeeper), imgSH=loadImg(g.imgShooter);
  let buts=0,tirs=0,gkX=W/2,gkDir=1,animId,locked=false;
  const GOAL={x:60,y:30,w:200,h:100}, GKW=40,GKH=50;
  function drawScene(){
    ctx.clearRect(0,0,W,H);
    // terrain
    ctx.fillStyle='#4ade80'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff'; ctx.fillRect(GOAL.x,GOAL.y,GOAL.w,GOAL.h);
    ctx.fillStyle='#4ade80';
    // but
    ctx.strokeStyle='#fff'; ctx.lineWidth=3;
    ctx.strokeRect(GOAL.x,GOAL.y,GOAL.w,GOAL.h);
    // gardien
    const gkY=GOAL.y+GOAL.h/2-GKH/2;
    if(imgGK&&imgGK.complete) spriteDraw(ctx,imgGK,gkX-GKW/2,gkY,GKW,GKH);
    else{ ctx.fillStyle='#f97316'; ctx.fillRect(gkX-GKW/2,gkY,GKW,GKH); ctx.fillStyle='#fff'; ctx.font='20px serif'; ctx.fillText('🧤',gkX-10,gkY+GKH*.7); }
    // tireur
    const shY=H-50;
    if(imgSH&&imgSH.complete) spriteDraw(ctx,imgSH,W/2-16,shY,32,40);
    else{ ctx.fillStyle='#3b82f6'; ctx.fillRect(W/2-8,shY,16,32); ctx.fillStyle='#fff'; ctx.font='20px serif'; ctx.fillText('⚽',W/2-10,shY+40); }
    ctx.fillStyle='#1e1b4b'; ctx.font='bold 13px sans-serif';
    ctx.fillText(buts+' but(s) / '+tirs+' tir(s)',8,18);
  }
  function moveGK(){ gkX+=gkDir*3; if(gkX>GOAL.x+GOAL.w-GKW/2||gkX<GOAL.x+GKW/2) gkDir*=-1; drawScene(); }
  animId=setInterval(moveGK,30);
  canvas.onclick=e=>{
    if(locked) return;
    const r=canvas.getBoundingClientRect();
    const cx=(e.clientX-r.left)*(W/r.width), cy=(e.clientY-r.top)*(H/r.height);
    if(cx<GOAL.x||cx>GOAL.x+GOAL.w||cy<GOAL.y||cy>GOAL.y+GOAL.h){ return; }
    locked=true; tirs++;
    // gardien couvre-t-il ?
    const gkSave = Math.abs(cx-gkX)<GKW;
    if(!gkSave) buts++;
    const info=document.getElementById('shotInfo');
    if(info) info.textContent = (gkSave?'🧤 Arrêté !':'⚽ But !') + ' — '+(total-tirs)+' tir(s) restant(s)';
    // animation balle
    let bx=W/2,by=H-50,prog=0;
    const ballInterval=setInterval(()=>{
      prog+=0.08; bx=W/2+(cx-W/2)*prog; by=(H-50)+(cy-(H-50))*prog;
      drawScene(); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(bx,by,8,0,Math.PI*2); ctx.fill();
      if(prog>=1){
        clearInterval(ballInterval);
        if(tirs>=total){
          clearInterval(animId);
          setTimeout(()=>{
            drawScene();
            ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(0,0,W,H);
            ctx.fillStyle='#fff'; ctx.font='bold 20px sans-serif'; ctx.textAlign='center';
            ctx.fillText(buts+' but(s) sur '+total+' tirs',W/2,H/2);
            ctx.textAlign='left';
            submitGameScore(slug,g,buts);
          },400);
        } else { locked=false; }
      }
    },16);
  };
  drawScene();
}

/* ---- 4. MEMORY ---- */
function playMemoryGame(area, slug, g){
  let cards=(g.cards||[]);
  if(cards.length<2){ area.innerHTML='<div class="empty">Importe au moins 2 images pour jouer.</div>'; return; }
  cards=[...cards,...cards].sort(()=>Math.random()-.5).map((src,i)=>({id:i,src,pairSrc:src,flipped:false,matched:false}));
  const cols=Math.min(6,Math.ceil(Math.sqrt(cards.length))); const rows=Math.ceil(cards.length/cols);
  const CW=60,CH=60,GAP=6, W=cols*(CW+GAP), H=rows*(CH+GAP);
  area.innerHTML=`<div style="margin-top:8px;text-align:center;">
    <div class="post-meta" id="memInfo">Retourne les paires !</div>
    <canvas id="memCanvas" width="${W}" height="${H}" style="border:2px solid var(--border);border-radius:8px;margin-top:6px;max-width:100%;cursor:pointer;"></canvas>
  </div>`;
  const canvas=document.getElementById('memCanvas'),ctx=canvas.getContext('2d');
  const imgs={}; cards.forEach(c=>{ if(!imgs[c.src]){ imgs[c.src]=loadSprite(c.src); }});
  let flipped=[],locked=false,start=Date.now();
  function cardPos(i){ return {x:(i%cols)*(CW+GAP), y:Math.floor(i/cols)*(CH+GAP)}; }
  function draw(){
    ctx.clearRect(0,0,W,H);
    cards.forEach((c,i)=>{
      const {x,y}=cardPos(i);
      if(c.matched){ ctx.fillStyle='#bbf7d0'; ctx.fillRect(x,y,CW,CH); return; }
      if(c.flipped){
        const img=imgs[c.src];
        if(img&&img.complete) spriteDraw(ctx,img,x,y,CW,CH);
        else{ ctx.fillStyle='#e0e7ff'; ctx.fillRect(x,y,CW,CH); }
      } else {
        ctx.fillStyle='#6366f1'; ctx.fillRect(x,y,CW,CH);
        ctx.fillStyle='#fff'; ctx.font='24px serif'; ctx.fillText('?',x+CW/2-7,y+CH/2+8);
      }
    });
  }
  canvas.onclick=e=>{
    if(locked) return;
    const r=canvas.getBoundingClientRect();
    const mx=(e.clientX-r.left)*(W/r.width), my=(e.clientY-r.top)*(H/r.height);
    const idx=cards.findIndex((_,i)=>{ const{x,y}=cardPos(i); return mx>x&&mx<x+CW&&my>y&&my<y+CH; });
    if(idx<0||cards[idx].flipped||cards[idx].matched) return;
    cards[idx].flipped=true; flipped.push(idx); draw();
    if(flipped.length===2){
      locked=true;
      setTimeout(()=>{
        if(cards[flipped[0]].pairSrc===cards[flipped[1]].pairSrc){ cards[flipped[0]].matched=cards[flipped[1]].matched=true; }
        else { cards[flipped[0]].flipped=cards[flipped[1]].flipped=false; }
        flipped=[]; locked=false; draw();
        if(cards.every(c=>c.matched)){
          const secs=Math.round((Date.now()-start)/1000);
          const info=document.getElementById('memInfo');
          if(info) info.textContent='🎉 Terminé en '+secs+'s !';
          submitGameScore(slug,g,secs);
        }
      },800);
    }
  };
  (function loop(){
    draw();
    if(document.getElementById('memCanvas')) requestAnimationFrame(loop);
  })();
}

/* ---- 5. QUI C'EST ? (SILHOUETTE) ---- */
function playSilhouetteGame(area, slug, g){
  const qs=g.questions||[]; if(!qs.length){ area.innerHTML='<div class="empty">Aucune question configurée.</div>'; return; }
  let idx=0,score=0,timer=null,activeSilRaf=null;
  function showQ(){
    if(activeSilRaf){ cancelAnimationFrame(activeSilRaf); activeSilRaf=null; }
    if(idx>=qs.length){
      area.innerHTML=`<div style="margin-top:8px;" class="post-meta">🎉 Fin ! Score : ${score}/${qs.length}</div>`;
      submitGameScore(slug,g,score); return;
    }
    const q=qs[idx], tpq=g.timePerQ||10;
    let timeLeft=tpq;
    area.innerHTML=`<div style="margin-top:8px;text-align:center;">
      <div class="post-meta" id="silTimer">⏱ ${tpq}s · Question ${idx+1}/${qs.length} · Score : ${score}</div>
      <canvas id="silCanvas" width="160" height="160" style="border-radius:8px;margin:6px 0;"></canvas>
      <input id="silInput" placeholder="Tape ton réponse..." style="width:100%;max-width:240px;">
      <button id="silOk" style="margin-top:6px;">Valider</button>
    </div>`;
    // dessine silhouette
    const sil = loadSprite(q.img);
    const canvas=document.getElementById('silCanvas'), ctx=canvas.getContext('2d');
    let silRaf;
    function drawSilhouette(){
      if(sil.complete){
        ctx.clearRect(0,0,160,160);
        spriteDraw(ctx,sil,0,0,160,160);
        const d=ctx.getImageData(0,0,160,160);
        for(let i=0;i<d.data.length;i+=4){ d.data[i]=0; d.data[i+1]=0; d.data[i+2]=0; }
        ctx.putImageData(d,0,0);
      }
      silRaf = requestAnimationFrame(drawSilhouette);
      activeSilRaf = silRaf;
    }
    drawSilhouette();
    function answer(){
      clearInterval(timer);
      const val=(document.getElementById('silInput').value||'').trim().toLowerCase();
      if(val===q.name.toLowerCase()){ score++; toast('✅ Bonne réponse !'); }
      else { toast('❌ C\'était : '+q.name); }
      idx++; showQ();
    }
    document.getElementById('silOk').onclick=answer;
    document.getElementById('silInput').addEventListener('keydown',e=>{ if(e.key==='Enter') answer(); });
    timer=setInterval(()=>{
      timeLeft--;
      const t=document.getElementById('silTimer');
      if(!t){ clearInterval(timer); return; }
      t.textContent=`⏱ ${timeLeft}s · Question ${idx+1}/${qs.length} · Score : ${score}`;
      if(timeLeft<=0){ clearInterval(timer); toast('⏰ Temps écoulé ! C\'était : '+q.name); idx++; showQ(); }
    },1000);
  }
  showQ();
}

/* ---- 6. RÉPÈTE LA SÉQUENCE ---- */
function playSequenceGame(area, slug, g){
  const DIRS=['⬆️','⬇️','⬅️','➡️'];
  const imgs=g.seqImages||[];
  const maxLen=g.seqMax||8;
  let seq=[],input=[],level=1,score=0,showing=false;
  area.innerHTML=`<div style="margin-top:8px;text-align:center;">
    <div class="post-meta" id="seqInfo">Observe et répète la séquence !</div>
    <div id="seqDisplay" style="font-size:32px;min-height:48px;margin:8px 0;"></div>
    <div id="seqBtns" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px;"></div>
    <button id="seqStart">Démarrer</button>
  </div>`;
  const display=document.getElementById('seqDisplay');
  const btns=document.getElementById('seqBtns');
  // boutons
  DIRS.forEach((d,i)=>{
    const btn=document.createElement('button');
    btn.className='secondary'; btn.style.fontSize='22px'; btn.style.width='52px'; btn.style.height='52px';
    if(imgs[i]){ const im=document.createElement('img'); im.src=imgs[i]; im.style.width='36px'; im.style.height='36px'; btn.appendChild(im); }
    else { btn.textContent=d; }
    btn.onclick=()=>{ if(showing) return; checkInput(i); };
    btns.appendChild(btn);
  });
  function showSeq(){
    showing=true;
    let i=0;
    const info=document.getElementById('seqInfo');
    if(info) info.textContent='Regarde bien... (niveau '+level+')';
    const iv=setInterval(()=>{
      if(!document.getElementById('seqDisplay')){ clearInterval(iv); return; }
      if(i<seq.length){
        const el=document.getElementById('seqDisplay');
        if(el){ el.textContent=''; if(imgs[seq[i]]){ const im=document.createElement('img'); im.src=imgs[seq[i]]; im.style.height='48px'; el.appendChild(im); } else el.textContent=DIRS[seq[i]]; }
        i++;
      } else {
        clearInterval(iv);
        const el=document.getElementById('seqDisplay'); if(el) el.textContent='';
        const info2=document.getElementById('seqInfo'); if(info2) info2.textContent='À toi !';
        input=[]; showing=false;
      }
    },800);
  }
  function checkInput(dir){
    input.push(dir);
    const pos=input.length-1;
    if(input[pos]!==seq[pos]){
      const info=document.getElementById('seqInfo'); if(info) info.textContent='❌ Raté ! Score final : '+score;
      submitGameScore(slug,g,score); return;
    }
    if(input.length===seq.length){
      score+=level; level++;
      if(level>maxLen){ const info=document.getElementById('seqInfo'); if(info) info.textContent='🏆 Parfait ! Score : '+score; submitGameScore(slug,g,score); return; }
      const info=document.getElementById('seqInfo'); if(info) info.textContent='✅ Correct ! Prépare-toi...';
      seq.push(Math.floor(Math.random()*4));
      setTimeout(showSeq,800);
    }
  }
  document.getElementById('seqStart').onclick=()=>{
    document.getElementById('seqStart').remove();
    seq=[Math.floor(Math.random()*4)]; showSeq();
  };
}

/* ---- 7. DODGE (évite les obstacles, vue du dessus) ---- */
function playDodgeGame(area, slug, g){
  const W=320,H=240;
  area.innerHTML=`<div style="margin-top:8px;text-align:center;">
    <canvas id="dodgeCanvas" width="${W}" height="${H}" style="border:2px solid var(--border);border-radius:8px;max-width:100%;touch-action:none;"></canvas>
    <div class="post-meta" style="margin-top:4px;">Flèches / ZQSD ou maintiens le doigt</div>
  </div>`;
  const canvas=document.getElementById('dodgeCanvas'),ctx=canvas.getContext('2d');
  function loadImg(src){ return loadSprite(src); }
  const imgP=loadImg(g.imgPlayer),imgO=loadImg(g.imgObstacle),imgBg=loadImg(g.imgBg);
  let player={x:W/2,y:H-50,w:30,h:30,vx:0,vy:0};
  let obstacles=[],dist=0,speed=2,alive=true,frame=0,bgY=0;
  const keys={};
  document.addEventListener('keydown',function kd(e){ if(!document.getElementById('dodgeCanvas')){document.removeEventListener('keydown',kd); document.removeEventListener('keyup',ku); return;} keys[e.key]=true; });
  const ku=e=>{ keys[e.key]=false; };
  document.addEventListener('keyup',ku);
  let touchVx=0,touchVy=0;
  canvas.addEventListener('touchstart',e=>{ const t=e.touches[0]; const r=canvas.getBoundingClientRect(); const cx=(t.clientX-r.left)*(W/r.width); const cy=(t.clientY-r.top)*(H/r.height); touchVx=Math.sign(cx-player.x)*3; touchVy=Math.sign(cy-player.y)*3; },{passive:true});
  canvas.addEventListener('touchend',()=>{ touchVx=0; touchVy=0; },{passive:true});
  function update(){
    if(!alive) return;
    frame++; dist+=speed; if(frame%200===0) speed+=0.5;
    bgY=(bgY+speed)%H;
    // move player
    let vx=0,vy=0;
    if(keys['ArrowLeft']||keys['q']||keys['Q']) vx=-4;
    if(keys['ArrowRight']||keys['d']||keys['D']) vx=4;
    if(keys['ArrowUp']||keys['z']||keys['Z']) vy=-4;
    if(keys['ArrowDown']||keys['s']||keys['S']) vy=4;
    vx=vx||touchVx; vy=vy||touchVy;
    player.x=Math.max(0,Math.min(W-player.w,player.x+vx));
    player.y=Math.max(0,Math.min(H-player.h,player.y+vy));
    // spawn
    if(frame%40===0) obstacles.push({x:Math.random()*(W-30),y:-30,w:30,h:30,vy:speed+Math.random()*2});
    obstacles.forEach(o=>o.y+=o.vy);
    obstacles=obstacles.filter(o=>o.y<H+40);
    if(obstacles.some(o=> player.x<o.x+o.w&&player.x+player.w>o.x&&player.y<o.y+o.h&&player.y+player.h>o.y)){
      alive=false; submitGameScore(slug,g,Math.floor(dist));
    }
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    if(imgBg&&imgBg.complete){ for(let yy=-H+bgY;yy<H;yy+=H) spriteDraw(ctx,imgBg,0,yy,W,H); }
    else { ctx.fillStyle='#1e3a5f'; ctx.fillRect(0,0,W,H); }
    obstacles.forEach(o=>{
      if(imgO&&imgO.complete) spriteDraw(ctx,imgO,o.x,o.y,o.w,o.h);
      else{ ctx.fillStyle='#ef4444'; ctx.fillRect(o.x,o.y,o.w,o.h); }
    });
    if(imgP&&imgP.complete) spriteDraw(ctx,imgP,player.x,player.y,player.w,player.h);
    else{ ctx.fillStyle='#4f46e5'; ctx.fillRect(player.x,player.y,player.w,player.h); }
    ctx.fillStyle='#fff'; ctx.font='bold 13px sans-serif'; ctx.fillText('Distance : '+Math.floor(dist)+'m',8,18);
    if(!alive){
      ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#fff'; ctx.font='bold 18px sans-serif'; ctx.textAlign='center';
      ctx.fillText('Score final : '+Math.floor(dist)+'m',W/2,H/2); ctx.textAlign='left';
    }
  }
  function loop(){ draw(); if(alive) requestAnimationFrame(()=>{ update(); loop(); }); }
  loop();
}

/* ---- 9. JEU PERSONNALISÉ ---- */
function playCustomGame(area, slug, g){
  const W=320, H=440;
  const entitiesDef = g.cEntities||[];
  if(!entitiesDef.length){ area.innerHTML='<div class="empty">Ce jeu n\'a aucun élément configuré.</div>'; return; }
  const mode = g.cPlayerMode||'four';
  area.innerHTML = `<div style="margin-top:8px;text-align:center;">
    <div class="post-meta" id="cInfo">Score : 0 ${g.cLives?'❤️'.repeat(g.cLives):''}</div>
    <canvas id="cCanvas" width="${W}" height="${H}" style="border:2px solid var(--border);border-radius:8px;margin-top:6px;max-width:100%;touch-action:none;background:#eef0f8;"></canvas>
    <div id="cControls" style="margin-top:8px;"></div>
  </div>`;
  const canvas=document.getElementById('cCanvas'), ctx=canvas.getContext('2d');
  const controls=document.getElementById('cControls');
  const info=document.getElementById('cInfo');

  const pSize=34;
  const player={x:W/2-pSize/2, y:H-60, w:pSize, h:pSize, tx:W/2, ty:H-60};
  const pSprite = loadSprite(g.cPlayerImg);
  const bgSprite = g.cBg ? loadSprite(g.cBg) : null;
  const entSprites = entitiesDef.map(e=> loadSprite(e.img));

  let score=0, lives=g.cLives||0, alive=true, over=false;
  let active=[]; // instances vivantes
  let startMs=Date.now();
  let keys={};

  function onKey(e){ keys[e.key.toLowerCase()]=true; }
  function onKeyUp(e){ keys[e.key.toLowerCase()]=false; }
  window.addEventListener('keydown', onKey);
  window.addEventListener('keyup', onKeyUp);

  // Contrôles tactiles
  if(mode==='drag'){
    function moveTo(clientX, clientY){
      const r=canvas.getBoundingClientRect();
      player.tx = (clientX-r.left)*(W/r.width) - player.w/2;
      player.ty = (clientY-r.top)*(H/r.height) - player.h/2;
    }
    canvas.addEventListener('pointerdown', e=>{ moveTo(e.clientX,e.clientY); });
    canvas.addEventListener('pointermove', e=>{ if(e.buttons||e.pressure>0) moveTo(e.clientX,e.clientY); });
  } else if(mode==='horizontal'){
    controls.innerHTML = `<button class="secondary" id="cLeft" style="width:80px;">⬅️</button> <button class="secondary" id="cRight" style="width:80px;">➡️</button>`;
    bindHold('cLeft','left'); bindHold('cRight','right');
  } else { // four
    controls.innerHTML = `
      <div style="display:grid;grid-template-columns:repeat(3,54px);gap:4px;justify-content:center;">
        <span></span><button class="secondary" id="cUp">⬆️</button><span></span>
        <button class="secondary" id="cLeft">⬅️</button><span></span><button class="secondary" id="cRight">➡️</button>
        <span></span><button class="secondary" id="cDown">⬇️</button><span></span>
      </div>`;
    bindHold('cUp','up'); bindHold('cDown','down'); bindHold('cLeft','left'); bindHold('cRight','right');
  }
  function bindHold(id, dir){
    const el=document.getElementById(id); if(!el) return;
    const on=e=>{ e.preventDefault(); keys[dir]=true; };
    const off=()=>{ keys[dir]=false; };
    el.addEventListener('pointerdown',on); el.addEventListener('pointerup',off);
    el.addEventListener('pointerleave',off); el.addEventListener('pointercancel',off);
  }

  const spawners = entitiesDef.map((def,i)=>({ def, sprite:entSprites[i], nextAt: Date.now()+def.rate*1000 }));

  function spawn(def, sprite){
    const size = def.size||32;
    let inst = {def, sprite, w:size, h:size, vx:0, vy:0};
    const speedPx = (def.speed||4) * 1.3;
    if(def.behavior==='fall'){
      inst.x = Math.random()*(W-size); inst.y=-size; inst.vy=speedPx;
    } else if(def.behavior==='patrol'){
      inst.x = Math.random()<0.5?0:W-size; inst.y = 40+Math.random()*(H-140);
      inst.vx = inst.x<W/2 ? speedPx : -speedPx;
    } else if(def.behavior==='chase'){
      const edge=Math.floor(Math.random()*4);
      if(edge===0){inst.x=Math.random()*W;inst.y=-size;}
      else if(edge===1){inst.x=Math.random()*W;inst.y=H;}
      else if(edge===2){inst.x=-size;inst.y=Math.random()*H;}
      else {inst.x=W;inst.y=Math.random()*H;}
    } else if(def.behavior==='random'){
      inst.x=Math.random()*(W-size); inst.y=Math.random()*(H-140);
      const a=Math.random()*Math.PI*2; inst.vx=Math.cos(a)*speedPx; inst.vy=Math.sin(a)*speedPx;
      inst.nextTurn=Date.now()+1000+Math.random()*1500;
    } else { // static
      inst.x=Math.random()*(W-size); inst.y=Math.random()*(H-140);
    }
    active.push(inst);
  }

  function applyEffect(effect){
    if(effect==='score1') score+=1;
    else if(effect==='score5') score+=5;
    else if(effect==='scoreMinus1') score=Math.max(0,score-1);
    else if(effect==='life'){ lives=Math.max(0,lives-1); if(g.cLives && lives<=0) endGame('lose'); }
    else if(effect==='win') endGame('win');
    else if(effect==='lose') endGame('lose');
  }

  function endGame(status){
    if(over) return;
    over=true; alive=false;
    let msg = status==='win' ? '🎉 Victoire ! Score : '+score : (status==='time' ? '⏰ Temps écoulé ! Score : '+score : '💀 Perdu ! Score : '+score);
    if(info) info.textContent = msg;
    submitGameScore(slug, g, score);
  }

  function update(){
    if(over) return;
    const spd = (g.cPlayerSpeed||5)*1.6;
    if(mode==='drag'){
      player.x += (player.tx-player.x)*0.18;
      player.y += (player.ty-player.y)*0.18;
    } else {
      if(keys['left']||keys['arrowleft']||keys['q']||keys['a']) player.x-=spd;
      if(keys['right']||keys['arrowright']||keys['d']) player.x+=spd;
      if(mode==='four'){
        if(keys['up']||keys['arrowup']||keys['z']||keys['w']) player.y-=spd;
        if(keys['down']||keys['arrowdown']||keys['s']) player.y+=spd;
      }
    }
    player.x=Math.max(0,Math.min(W-player.w,player.x));
    player.y=Math.max(0,Math.min(H-player.h,player.y));

    const now=Date.now();
    spawners.forEach(sp=>{ if(now>=sp.nextAt){ spawn(sp.def, sp.sprite); sp.nextAt=now+sp.def.rate*1000; } });

    active.forEach(inst=>{
      if(inst.def.behavior==='chase'){
        const cx=player.x+player.w/2, cy=player.y+player.h/2;
        const ex=inst.x+inst.w/2, ey=inst.y+inst.h/2;
        const dx=cx-ex, dy=cy-ey, dist=Math.hypot(dx,dy)||1;
        const spdI=(inst.def.speed||4)*1.3;
        inst.x += (dx/dist)*spdI; inst.y += (dy/dist)*spdI;
      } else if(inst.def.behavior==='patrol'){
        inst.x += inst.vx;
        if(inst.x<=0||inst.x>=W-inst.w) inst.vx*=-1;
      } else if(inst.def.behavior==='random'){
        if(now>inst.nextTurn){
          const a=Math.random()*Math.PI*2; const spdI=(inst.def.speed||4)*1.3;
          inst.vx=Math.cos(a)*spdI; inst.vy=Math.sin(a)*spdI; inst.nextTurn=now+1000+Math.random()*1500;
        }
        inst.x+=inst.vx; inst.y+=inst.vy;
        inst.x=Math.max(0,Math.min(W-inst.w,inst.x)); inst.y=Math.max(0,Math.min(H-inst.h,inst.y));
      } else if(inst.def.behavior==='fall'){
        inst.y += inst.vy;
      }
    });
    active = active.filter(inst=> !(inst.def.behavior==='fall' && inst.y>H+40));

    const hit = active.find(inst=>
      player.x<inst.x+inst.w && player.x+player.w>inst.x &&
      player.y<inst.y+inst.h && player.y+player.h>inst.y
    );
    if(hit){ active=active.filter(a=>a!==hit); applyEffect(hit.def.effect); }

    if(g.cWinScore>0 && score>=g.cWinScore) endGame('win');
    if(g.cDuration>0){
      const left = g.cDuration - (now-startMs)/1000;
      if(left<=0){ endGame(g.cWinScore>0?'time':'win'); }
      else if(info) info.textContent = `Score : ${score}${g.cLives?' · '+'❤️'.repeat(lives):''} · ⏱️ ${Math.ceil(left)}s`;
    } else if(info){
      info.textContent = `Score : ${score}${g.cLives?' · '+'❤️'.repeat(lives):''}`;
    }
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    if(bgSprite&&bgSprite.complete) spriteDraw(ctx,bgSprite,0,0,W,H);
    active.forEach(inst=>{ if(inst.sprite&&inst.sprite.complete) spriteDraw(ctx,inst.sprite,inst.x,inst.y,inst.w,inst.h); else { ctx.fillStyle='#ef4444'; ctx.fillRect(inst.x,inst.y,inst.w,inst.h); } });
    if(pSprite&&pSprite.complete) spriteDraw(ctx,pSprite,player.x,player.y,player.w,player.h);
    else { ctx.fillStyle='#4f46e5'; ctx.fillRect(player.x,player.y,player.w,player.h); }
  }

  function cleanup(){
    window.removeEventListener('keydown', onKey);
    window.removeEventListener('keyup', onKeyUp);
  }
  function loop(){
    update(); draw();
    if(!over && document.getElementById('cCanvas')){ requestAnimationFrame(loop); }
    else { cleanup(); }
  }
  loop();
}

function renderImmersiveFeed(container, posts, onLoadMore){

  container.innerHTML = '<div id="immersiveFeed"></div>';
  const feedEl = document.getElementById('immersiveFeed');
  posts.forEach(p=>{
    const liked = (p.likes||[]).includes(currentUser.uid);
    const disliked = (p.dislikes||[]).includes(currentUser.uid);
    const item = document.createElement('div');
    item.className = 'immersive-item';
    item.innerHTML = `
      ${p.mediaType==='video'
        ? `<video class="immersive-media" loop playsinline muted src="${p.mediaUrl||p.mediaBase64}"></video>`
        : `<img class="immersive-media" src="${p.mediaUrl||p.mediaBase64}">`}
      <div class="immersive-overlay">
        <div class="immersive-author"><img class="avatar" src="${p.authorAvatar||fallbackAvatar()}"><b>${esc(p.authorPseudo)}</b> <a href="#community/${p.communityId}" style="color:#fff;opacity:0.85;" onclick="event.stopPropagation()">· y/${esc(p.communitySlug||p.communityId)}</a></div>
        ${p.text? `<div class="immersive-text">${esc(p.text)}</div>`:''}
      </div>
      <div class="immersive-actions">
        <button class="imv-btn ${liked?'active-like':''}" data-act="like">👍<br>${(p.likes||[]).length}</button>
        <button class="imv-btn ${disliked?'active-dislike':''}" data-act="dislike">👎<br>${(p.dislikes||[]).length}</button>
        <button class="imv-btn" data-act="comments">💬</button>
        ${p.mediaType==='video'? `<button class="imv-btn" data-act="mute">🔇</button>`:''}
        ${p.authorUid!==currentUser.uid? `<button class="imv-btn" data-act="report">🚩</button>`:''}
        ${(p.authorUid===currentUser.uid || isAdmin())? `<button class="imv-btn" data-act="delete" style="color:#ff8a8a;">🗑️</button>`:''}
      </div>
    `;
    item.querySelectorAll('.imv-btn').forEach(btn=>{
      btn.onclick = ()=>{
        if(btn.dataset.act==='like'||btn.dataset.act==='dislike') vote(p.id, btn.dataset.act);
        else if(btn.dataset.act==='comments') openComments(p.id);
        else if(btn.dataset.act==='mute') toggleImmersiveSound(item, btn);
        else if(btn.dataset.act==='delete') deletePost(p.id);
        else if(btn.dataset.act==='report') openReport(p.authorUid, p.authorPseudo, 'post', p.id);
      };
    });
    if(p.mediaType==='video' && p.musicUrl){
      const audio = document.createElement('audio');
      audio.src = p.musicUrl; audio.loop = true; audio.className='imv-audio'; audio.muted = true;
      item.appendChild(audio);
    }
    feedEl.appendChild(item);
  });
  setupImmersiveObserver(feedEl);
  if(onLoadMore){
    let triggered = false;
    feedEl.addEventListener('scroll', ()=>{
      if(triggered) return;
      if(feedEl.scrollTop + feedEl.clientHeight >= feedEl.scrollHeight - feedEl.clientHeight*1.5){
        triggered = true;
        onLoadMore();
      }
    });
  }
}

function toggleImmersiveSound(item, btn){
  const video = item.querySelector('video');
  const audio = item.querySelector('audio');
  if(audio){
    audio.muted = !audio.muted;
    if(video) video.muted = true;
    btn.innerHTML = audio.muted ? '🔇' : '🔊';
  } else if(video){
    video.muted = !video.muted;
    btn.innerHTML = video.muted ? '🔇' : '🔊';
  }
}

function setupImmersiveObserver(feedEl){
  const items = feedEl.querySelectorAll('.immersive-item');
  const obs = new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      const video = entry.target.querySelector('video');
      const audio = entry.target.querySelector('audio');
      if(entry.isIntersecting && entry.intersectionRatio > 0.6){
        if(video) video.play().catch(()=>{});
        if(audio){ audio.currentTime = video ? video.currentTime : 0; audio.play().catch(()=>{}); }
      } else {
        if(video) video.pause();
        if(audio) audio.pause();
      }
    });
  }, {threshold:[0,0.6,1], root:feedEl});
  items.forEach(it=> obs.observe(it));
}

function renderAdmin(main){
  if(!isAdmin()){
    main.innerHTML = '<div class="panel"><div class="empty">Accès réservé aux administrateurs.</div></div>';
    return;
  }
  main.innerHTML = '<div class="panel"><div class="panel-head">🛡️ Panneau admin — Signalements</div><div class="panel-body" id="adminBody"><div class="empty">Chargement...</div></div></div>';
  db.collection('reports').orderBy('createdAt','desc').limit(300).get().then(async snap=>{
    const reports = []; snap.forEach(d=> reports.push({id:d.id, ...d.data()}));
    const body = document.getElementById('adminBody');
    if(!body) return;
    if(reports.length===0){ body.innerHTML = '<div class="empty">Aucun signalement pour le moment.</div>'; return; }
    const grouped = {};
    reports.forEach(r=>{
      if(!grouped[r.reportedUid]) grouped[r.reportedUid] = {pseudo:r.reportedPseudo, items:[]};
      grouped[r.reportedUid].items.push(r);
    });
    const uids = Object.keys(grouped);
    const userDocs = await Promise.all(uids.map(uid=> db.collection('users').doc(uid).get()));
    body.innerHTML = '';
    uids.forEach((uid, i)=>{
      const g = grouped[uid];
      const exists = userDocs[i].exists;
      const udata = exists ? userDocs[i].data() : {};
      const banned = exists && udata.banned;
      const banType = udata.banType;
      let statusBadge = '';
      if(banned) statusBadge = banType==='def'
        ? '<span class="ybadge" style="color:var(--red);background:var(--red-light);">Banni définitivement</span>'
        : '<span class="ybadge" style="color:var(--red);background:var(--red-light);">Banni</span>';
      const card = document.createElement('div');
      card.className = 'report-group' + (banned? ' banned':'');
      if(!exists){
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div><b>${esc(g.pseudo)}</b> — ${g.items.length} signalement(s) <span class="ybadge" style="color:var(--red);background:var(--red-light);">Compte supprimé</span></div>
          </div>
          ${g.items.slice(0,5).map(r=> `<div class="report-line">Par ${esc(r.reporterPseudo)} · ${esc(r.reason)}${r.details? ' — '+esc(r.details):''} · ${timeAgo(r.createdAt)}</div>`).join('')}
        `;
        body.appendChild(card);
        return;
      }
      card.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;">
          <div><a href="#profile/${uid}"><b>${esc(g.pseudo)}</b></a> — ${g.items.length} signalement(s) ${statusBadge}</div>
          <div style="display:flex; gap:6px; flex-wrap:wrap;">
            ${banned
              ? `<button class="secondary small" data-act="unban">Débannir</button>`
              : `<button class="danger small" data-act="ban-normal">Bannir</button><button class="danger small" data-act="ban-def">Bannir déf.</button>`
            }
            <button class="danger small" data-act="delete-account">Supprimer le compte</button>
          </div>
        </div>
        ${g.items.slice(0,5).map(r=> `<div class="report-line">Par ${esc(r.reporterPseudo)} · ${esc(r.reason)}${r.details? ' — '+esc(r.details):''} · ${timeAgo(r.createdAt)}</div>`).join('')}
      `;
      card.querySelectorAll('button[data-act]').forEach(btn=>{
        btn.onclick = async ()=>{
          const act = btn.dataset.act;
          if(act==='unban'){
            await db.collection('users').doc(uid).update({banned:false, banType: firebase.firestore.FieldValue.delete()});
            toast('Utilisateur débanni.');
          } else if(act==='ban-normal'){
            await db.collection('users').doc(uid).update({banned:true, banType:'normal'});
            toast('Utilisateur banni.');
          } else if(act==='ban-def'){
            if(!confirm('Bannir définitivement cet utilisateur ? Cette décision est irrévocable.')) return;
            await db.collection('users').doc(uid).update({banned:true, banType:'def'});
            toast('Utilisateur banni définitivement.');
          } else if(act==='delete-account'){
            if(!confirm('Supprimer définitivement le compte de '+g.pseudo+' ? Cette action est irréversible.')) return;
            await db.collection('users').doc(uid).delete();
            toast('Compte supprimé.');
          }
          renderAdmin(main);
        };
      });
      body.appendChild(card);
    });
  }).catch(err=>{
    const body = document.getElementById('adminBody');
    if(body) body.innerHTML = '<div class="empty">Erreur : '+esc(err.message)+'</div>';
  });
}

  const myYappers = effectiveYappers(currentUser);
  const canLive = myYappers>=100;
  main.innerHTML = `
    <div class="panel">
      <div class="panel-head">🔴 Live</div>
      <div class="panel-body">
        ${canLive
          ? '<button id="startLiveBtn">Démarrer un live</button>'
          : `<button disabled title="Débloqué à 100 Yappers">Démarrer un live</button><div class="post-meta" style="margin-top:6px;">🪙 ${myYappers}/100 Yappers — encore ${100-myYappers} pour débloquer les lives.</div>`}
        <div style="display:flex; gap:8px; margin-top:12px;">
          <input id="joinCodeInput" placeholder="Code du live (ex: AB12CD)" style="text-transform:uppercase;">
          <button id="joinCodeBtn" class="secondary">Rejoindre</button>
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head">Lives en cours</div>
      <div id="liveList"><div class="empty">Chargement...</div></div>
    </div>`;

  document.getElementById('startLiveBtn')?.addEventListener('click', startLive);
  document.getElementById('joinCodeBtn').onclick = ()=>{
    const code = document.getElementById('joinCodeInput').value.trim().toUpperCase();
    if(code) location.hash = '#live/'+code;
  };
  document.getElementById('joinCodeInput').addEventListener('keydown', e=>{
    if(e.key==='Enter') document.getElementById('joinCodeBtn').click();
  });

  const liveUn = db.collection('lives').where('active','==',true).orderBy('createdAt','desc').limit(30)
  .onSnapshot(snap=>{
    const list = document.getElementById('liveList');
    if(!list) return;
    if(snap.empty){ list.innerHTML = '<div class="empty">Aucun live en cours pour le moment.</div>'; return; }
    list.innerHTML = '';
    snap.forEach(d=>{
      const l = d.data();
      const row = document.createElement('div');
      row.className = 'live-row';
      row.innerHTML = `
        <span class="live-dot"></span>
        <img class="avatar" src="${l.hostAvatar||fallbackAvatar()}">
        <div style="flex:1;">
          <div><b>${esc(l.hostPseudo)}</b></div>
          <div class="notif-meta">${l.viewerCount||0} spectateur(s)</div>
        </div>`;
      row.onclick = ()=> location.hash = '#live/'+d.id;
      list.appendChild(row);
    });
  }, err=>{
    const list = document.getElementById('liveList');
    if(list) list.innerHTML = '<div class="empty">Erreur : '+esc(err.message)+'</div>';
  });
unsubscribers.push(liveUn);
}

async function startLive(){
  if(effectiveYappers(currentUser) < 100){ toast('Il faut 100 Yappers pour démarrer un live.'); return; }
  let code = genLiveCode();
  for(let i=0;i<5;i++){
    const existing = await db.collection('lives').doc(code).get();
    if(!existing.exists || existing.data().active===false) break;
    code = genLiveCode();
  }
  await db.collection('lives').doc(code).set({
    hostUid: currentUser.uid,
    hostPseudo: currentUser.pseudo,
    hostAvatar: currentUser.avatar||'',
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    active: true,
    viewerCount: 0
  });
  await incrementUserStat(currentUser.uid, 'livesStarted', 1);
  evaluateBadges(currentUser.uid);
  location.hash = '#live/'+code;
}

function renderLiveRoom(main, codeRaw){
  const code = (codeRaw||'').toUpperCase();
  main.innerHTML = '<div class="empty">Chargement...</div>';
  db.collection('lives').doc(code).get().then(doc=>{
    if(!doc.exists || doc.data().active===false){
      main.innerHTML = '<div class="panel"><div class="empty">Ce live est terminé ou n\'existe pas. <a href="#live">← Retour</a></div></div>';
      return;
    }
    const live = doc.data();
    const isHost = currentUser.uid === live.hostUid;

    main.innerHTML = `
      <div class="panel">
        <div class="panel-head"><a href="#live">← Live</a> · ${esc(live.hostPseudo)}</div>
        <div class="panel-body">
          <div class="live-video-wrap">
            <video id="liveVideo" autoplay playsinline ${isHost?'muted':''}></video>
            <div class="live-stats">
              <span class="live-stat-pill">🔴 <span id="liveViewerCount">${live.viewerCount||0}</span></span>
              ${isHost? `<span class="live-stat-pill">Code : ${code}</span>` : ''}
            </div>
          </div>
          <div id="liveControls" style="display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;"></div>
          <div id="liveChatBox"></div>
          <div id="liveChatInputRow">
            <input id="liveChatInput" placeholder="Écris un message...">
            <button id="liveChatSendBtn">Envoyer</button>
          </div>
        </div>
      </div>`;

    const controls = document.getElementById('liveControls');
    const videoEl = document.getElementById('liveVideo');
    const peers = {};
    let localStream = null;
    let broadcastOn = !!(currentUser.liveActive && currentUser.liveCode===code);

    const chatUn = db.collection('lives').doc(code).collection('chat').orderBy('createdAt','asc').limit(200)
      .onSnapshot(snap=>{
        const box = document.getElementById('liveChatBox');
        if(!box) return;
        box.innerHTML = '';
        snap.forEach(d=>{
          const m = d.data();
          const el = document.createElement('div');
          el.className = 'live-chat-msg';
          el.innerHTML = '<b>'+esc(m.pseudo)+'</b>'+esc(m.text);
          box.appendChild(el);
        });
        box.scrollTop = box.scrollHeight;
      });
    unsubscribers.push(chatUn);

    const sendLiveChat = async ()=>{
      const input = document.getElementById('liveChatInput');
      const text = input.value.trim();
      if(!text) return;
      input.value = '';
      await db.collection('lives').doc(code).collection('chat').add({
        uid: currentUser.uid, pseudo: currentUser.pseudo, text,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    };
    document.getElementById('liveChatSendBtn').onclick = sendLiveChat;
    document.getElementById('liveChatInput').addEventListener('keydown', e=>{ if(e.key==='Enter') sendLiveChat(); });

    const liveDocUn = db.collection('lives').doc(code).onSnapshot(d=>{
      if(!d.exists) return;
      const data = d.data();
      const c = document.getElementById('liveViewerCount');
      if(c) c.textContent = data.viewerCount||0;
      if(data.active===false){
        toast('Ce live est terminé.');
        location.hash = '#live';
      }
    });
    unsubscribers.push(liveDocUn);

    function copyCode(){
      navigator.clipboard?.writeText(code).then(()=> toast('Code copié : '+code)).catch(()=> toast('Code : '+code));
    }

    async function toggleBroadcast(){
      broadcastOn = !broadcastOn;
      if(broadcastOn){
        await db.collection('users').doc(currentUser.uid).update({liveActive:true, liveCode:code});
        currentUser.liveActive = true; currentUser.liveCode = code;
        toast('Ton code de live est affiché sur ton profil.');
      }else{
        await db.collection('users').doc(currentUser.uid).update({liveActive:false});
        currentUser.liveActive = false;
        toast('Live retiré de ton profil.');
      }
      renderControls();
    }

    async function endLive(){
      await db.collection('lives').doc(code).update({active:false});
      if(currentUser.liveCode===code){
        await db.collection('users').doc(currentUser.uid).update({liveActive:false});
        currentUser.liveActive = false;
      }
      location.hash = '#live';
    }

    async function leaveLive(){
      await db.collection('lives').doc(code).collection('viewers').doc(currentUser.uid).delete().catch(()=>{});
      await db.collection('lives').doc(code).update({viewerCount: firebase.firestore.FieldValue.increment(-1)}).catch(()=>{});
      location.hash = '#live';
    }

    function renderControls(){
      controls.innerHTML = '';
      if(isHost){
        const copyBtn = document.createElement('button');
        copyBtn.className='secondary'; copyBtn.textContent='Copier le code';
        copyBtn.onclick = copyCode;
        controls.appendChild(copyBtn);

        const bcBtn = document.createElement('button');
        bcBtn.className='secondary';
        bcBtn.textContent = broadcastOn ? 'Retirer de mon profil' : 'Diffuser le code sur mon profil';
        bcBtn.onclick = toggleBroadcast;
        controls.appendChild(bcBtn);

        const endBtn = document.createElement('button');
        endBtn.className='danger'; endBtn.textContent='Terminer le live';
        endBtn.onclick = endLive;
        controls.appendChild(endBtn);
      }else{
        const leaveBtn = document.createElement('button');
        leaveBtn.className='secondary'; leaveBtn.textContent='Quitter le live';
        leaveBtn.onclick = leaveLive;
        controls.appendChild(leaveBtn);
      }
    }
    renderControls();

    let cleaned = false;
    function cleanup(){
      if(cleaned) return; cleaned = true;
      Object.values(peers).forEach(pc=>{ try{ pc.close(); }catch(e){} });
      if(localStream) localStream.getTracks().forEach(t=>t.stop());
    }
    unsubscribers.push(cleanup);

    if(isHost){
      navigator.mediaDevices.getUserMedia({video:true, audio:true}).then(stream=>{
        localStream = stream;
        videoEl.srcObject = stream;
      }).catch(err=>{
        toast("Impossible d'accéder à la caméra : "+err.message);
      });

      function setupPeerForViewer(viewerUid){
        if(peers[viewerUid]) return;
        const pc = new RTCPeerConnection(RTC_CONFIG);
        peers[viewerUid] = pc;
        if(localStream) localStream.getTracks().forEach(t=> pc.addTrack(t, localStream));
        const viewerRef = db.collection('lives').doc(code).collection('viewers').doc(viewerUid);
        pc.onicecandidate = e=>{
          if(e.candidate) viewerRef.collection('hostCandidates').add(e.candidate.toJSON());
        };
        pc.createOffer().then(offer=> pc.setLocalDescription(offer)).then(()=>{
          viewerRef.update({offer: {type: pc.localDescription.type, sdp: pc.localDescription.sdp}});
        });
        const un1 = viewerRef.onSnapshot(snap=>{
          const data = snap.data();
          if(data && data.answer && !pc.currentRemoteDescription){
            pc.setRemoteDescription(new RTCSessionDescription(data.answer));
          }
        });
        const un2 = viewerRef.collection('viewerCandidates').onSnapshot(snap=>{
          snap.docChanges().forEach(ch=>{
            if(ch.type==='added') pc.addIceCandidate(new RTCIceCandidate(ch.doc.data())).catch(()=>{});
          });
        });
        unsubscribers.push(un1, un2);
      }

      const viewersUn = db.collection('lives').doc(code).collection('viewers').onSnapshot(snap=>{
        snap.docChanges().forEach(ch=>{
          if(ch.type==='added') setupPeerForViewer(ch.doc.id);
          if(ch.type==='removed' && peers[ch.doc.id]){ peers[ch.doc.id].close(); delete peers[ch.doc.id]; }
        });
      });
      unsubscribers.push(viewersUn);

    }else{
      const viewerRef = db.collection('lives').doc(code).collection('viewers').doc(currentUser.uid);
      const pc = new RTCPeerConnection(RTC_CONFIG);
      peers[currentUser.uid] = pc;
      pc.ontrack = e=>{ videoEl.srcObject = e.streams[0]; };
      pc.onicecandidate = e=>{
        if(e.candidate) viewerRef.collection('viewerCandidates').add(e.candidate.toJSON());
      };
      viewerRef.set({uid: currentUser.uid, pseudo: currentUser.pseudo, joinedAt: firebase.firestore.FieldValue.serverTimestamp()})
        .then(()=> db.collection('lives').doc(code).update({viewerCount: firebase.firestore.FieldValue.increment(1)}));

      const un1 = viewerRef.onSnapshot(snap=>{
        const data = snap.data();
        if(data && data.offer && !pc.currentRemoteDescription){
          pc.setRemoteDescription(new RTCSessionDescription(data.offer)).then(()=> pc.createAnswer())
            .then(answer=> pc.setLocalDescription(answer)).then(()=>{
              viewerRef.update({answer: {type: pc.localDescription.type, sdp: pc.localDescription.sdp}});
            });
        }
      });
      const un2 = viewerRef.collection('hostCandidates').onSnapshot(snap=>{
        snap.docChanges().forEach(ch=>{
          if(ch.type==='added') pc.addIceCandidate(new RTCIceCandidate(ch.doc.data())).catch(()=>{});
        });
      });
      unsubscribers.push(un1, un2);
    }
  }).catch(err=>{
    main.innerHTML = '<div class="panel"><div class="empty">Erreur : '+esc(err.message)+'</div></div>';
  });
}
</script>
</body>
</html>
