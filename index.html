<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>2Yap</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/8.10.0/firebase-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/8.10.0/firebase-auth.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/8.10.0/firebase-firestore.js"></script>
<style>
  :root{
    --primary:#4F46E5;
    --primary-dark:#4338CA;
    --primary-light:#EEF0FF;
    --accent:#F5A524;
    --accent-dark:#8a5a05;
    --bg:#F3F4F8;
    --panel:#ffffff;
    --border:#E5E7EE;
    --text:#1E2233;
    --text-mute:#6B7280;
    --green:#16A34A;
    --green-light:#E9F9EE;
    --red:#DC2626;
    --red-light:#FDECEC;
  }
  [data-theme="dark"]{
    --primary:#7C7CF0;
    --primary-dark:#9494FF;
    --primary-light:#232449;
    --accent:#F5B94A;
    --accent-dark:#F5B94A;
    --bg:#14151F;
    --panel:#1D1F2C;
    --border:#2C2E3F;
    --text:#EDEEF5;
    --text-mute:#9498AC;
    --green:#34D072;
    --green-light:#173321;
    --red:#F0605C;
    --red-light:#3A1E1E;
  }
  body, .panel, button, input, textarea, select{ transition:background-color .2s ease, color .2s ease, border-color .2s ease; }
  @keyframes fadeInUp{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  @keyframes popIn{ 0%{transform:scale(1);} 40%{transform:scale(1.25);} 100%{transform:scale(1);} }
  .panel, .post, .comm-card, .comment-item{ animation:fadeInUp .25s ease; }
  .vote-btn.active-like, .vote-btn.active-dislike, .imv-btn.active-like, .imv-btn.active-dislike{ animation:popIn .28s ease; }
  .toast{ animation:fadeInUp .2s ease; }
  *{box-sizing:border-box;}
  html{-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size:15px; line-height:1.45;
    color:var(--text);
    background:var(--bg);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--primary);text-decoration:none;}
  a:hover{text-decoration:underline;}
  button, .btn{
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    color:#fff;
    border:none;
    border-radius:10px;
    padding:10px 16px;
    cursor:pointer;
    background:var(--primary);
    transition:background .15s ease, transform .05s ease;
  }
  button:hover{background:var(--primary-dark);}
  button:active{transform:scale(0.98);}
  button.secondary{
    background:#EEF0F4; color:var(--text);
  }
  button.secondary:hover{background:#E3E6EC;}
  button.danger{ background:var(--red); }
  button.danger:hover{ background:#B91C1C; }
  button.small{padding:6px 12px;font-size:13px; border-radius:8px;}
  input, textarea, select{
    font-family:inherit;font-size:15px;
    border:1.5px solid var(--border); border-radius:10px;
    padding:10px 12px; background:#fafbfd;
    width:100%;
  }
  input:focus, textarea:focus, select:focus{outline:none; border-color:var(--primary); background:#fff;}
  .hidden{display:none !important;}

  /* TOPBAR */
  #topbar{
    background:var(--panel);
    border-bottom:1px solid var(--border);
    padding:10px 14px;
    display:flex; align-items:center; gap:10px;
    position:sticky; top:0; z-index:50;
  }
  #hamburgerBtn{
    background:none; padding:8px; border-radius:8px;
    display:flex; flex-direction:column; gap:4px; justify-content:center; align-items:center;
    width:38px; height:38px; flex-shrink:0;
  }
  #hamburgerBtn:hover{background:var(--primary-light);}
  #hamburgerBtn span{display:block; width:18px; height:2px; background:var(--text); border-radius:2px;}
  #logo{
    font-weight:800; font-size:19px; color:var(--text);
    display:flex; align-items:center; gap:5px; letter-spacing:-0.3px;
  }
  #logo .star{color:var(--accent);}
  #topbar .spacer{flex:1;}
  #topbarProfileBtn{padding:0; background:none; width:34px; height:34px; border-radius:8px; overflow:hidden; flex-shrink:0;}
  #topbarProfileBtn img{width:100%; height:100%; object-fit:cover; display:block; border-radius:8px;}
  #notifBtn{background:none; font-size:19px; padding:6px; border-radius:8px; box-shadow:none; color:var(--text);}
  #notifBtn:hover{background:var(--primary-light);}
  #notifBadge{
    position:absolute; top:2px; right:2px; background:var(--red); color:#fff; font-size:10px; font-weight:700;
    min-width:16px; height:16px; border-radius:8px; display:flex; align-items:center; justify-content:center; padding:0 3px;
  }
  #notifOverlay{position:fixed; inset:0; background:rgba(20,22,35,0.4); z-index:96; opacity:0; pointer-events:none; transition:opacity .18s ease;}
  #notifOverlay.open{opacity:1; pointer-events:auto;}
  #notifPanel{
    position:fixed; top:56px; right:10px; left:10px; max-width:380px; margin-left:auto;
    background:var(--panel); border:1px solid var(--border); border-radius:14px; z-index:97;
    max-height:70vh; display:flex; flex-direction:column; overflow:hidden;
    transform:translateY(-8px) scale(0.98); opacity:0; pointer-events:none; transition:all .16s ease;
    box-shadow:0 8px 28px rgba(0,0,0,0.18);
  }
  #notifPanel.open{transform:translateY(0) scale(1); opacity:1; pointer-events:auto;}
  #notifList{overflow-y:auto;}
  .notif-item{display:flex; gap:9px; padding:10px 14px; border-bottom:1px solid var(--border); cursor:pointer;}
  .notif-item:last-child{border-bottom:none;}
  .notif-item:hover{background:var(--bg);}
  .notif-item.unread{background:var(--primary-light);}
  .notif-text{font-size:13px;}
  .notif-meta{font-size:11px; color:var(--text-mute); margin-top:2px;}

  /* DRAWER */
  #drawerOverlay{
    position:fixed; inset:0; background:rgba(20,22,35,0.45);
    z-index:98; opacity:0; pointer-events:none; transition:opacity .18s ease;
  }
  #drawerOverlay.open{opacity:1; pointer-events:auto;}
  #drawer{
    position:fixed; top:0; left:0; bottom:0; width:270px; max-width:82vw;
    background:var(--panel); z-index:99; padding:16px;
    transform:translateX(-100%); transition:transform .2s ease;
    overflow-y:auto; display:flex; flex-direction:column; gap:14px;
    box-shadow:2px 0 16px rgba(0,0,0,0.12);
  }
  #drawer.open{transform:translateX(0);}
  #drawer .drawer-logo{font-weight:800; font-size:18px; margin-bottom:2px; display:flex; align-items:center; gap:5px;}
  #drawer .drawer-logo .star{color:var(--accent);}
  #drawer .navlink{
    display:flex; align-items:center; gap:10px;
    padding:10px 10px; border-radius:10px; font-weight:600; color:var(--text); font-size:14.5px;
  }
  #drawer .navlink:hover{background:var(--primary-light); text-decoration:none; color:var(--primary);}
  #drawer .navlink .ic{width:20px; text-align:center;}
  #drawer hr{border:none; border-top:1px solid var(--border); margin:2px 0;}
  #drawer .drawer-label{font-size:11.5px; font-weight:700; color:var(--text-mute); text-transform:uppercase; letter-spacing:0.04em; padding:0 10px;}

  /* LAYOUT */
  #layout{max-width:640px; margin:0 auto; padding:14px 12px 60px;}
  #main-col{min-width:0;}
  .panel{
    background:var(--panel); border:1px solid var(--border); border-radius:14px;
    box-shadow:0 1px 2px rgba(20,22,35,0.03);
    margin-bottom:14px; overflow:hidden;
  }
  .panel-head{
    padding:12px 14px; font-weight:700; color:var(--text); font-size:15px;
    border-bottom:1px solid var(--border);
  }
  .panel-body{padding:14px;}

  /* Y/BADGE */
  .ybadge{
    display:inline-flex; align-items:center; gap:3px;
    background:var(--primary-light);
    border-radius:6px;
    padding:2px 8px; font-weight:700; color:var(--primary);
    font-size:12.5px;
  }

  /* AUTH SCREEN */
  #screen-auth{
    max-width:380px; margin:0 auto; padding:56px 16px; min-height:100vh; display:flex; align-items:center;
  }
  #screen-auth .panel{width:100%; margin-bottom:0;}
  #screen-auth .panel-body{display:flex; flex-direction:column; gap:10px; padding:24px 22px;}
  #screen-auth h1{
    text-align:center; font-weight:800; color:var(--text); letter-spacing:-0.5px;
    font-size:32px; margin:0 0 2px;
  }
  #screen-auth .sub{text-align:center; color:var(--text-mute); margin-bottom:12px; font-size:14px;}
  #authTabs{display:flex; gap:6px; margin-bottom:12px; background:#F1F2F6; padding:4px; border-radius:10px;}
  #authTabs button{flex:1; background:none; color:var(--text-mute); padding:8px;}
  #authTabs button:not(.secondary){background:#fff; color:var(--text); box-shadow:0 1px 2px rgba(0,0,0,0.08);}
  #authMsg{color:var(--red); font-size:13px; min-height:16px;}

  /* AVATAR */
  .avatar{
    width:38px; height:38px; border-radius:10px; object-fit:cover;
    border:1px solid var(--border); background:#EEF0F4; flex-shrink:0;
  }
  .avatar.lg{width:68px; height:68px; border-radius:16px;}

  /* POST CARD */
  .post{border-bottom:1px solid var(--border); padding:14px;}
  .post:last-child{border-bottom:none;}
  .post-head{display:flex; align-items:center; gap:9px; margin-bottom:8px;}
  .post-meta{font-size:12.5px; color:var(--text-mute);}
  .post-text{margin:4px 0 8px; white-space:pre-wrap; word-break:break-word;}
  .post video{width:100%; max-height:440px; border-radius:10px; background:#000; display:block;}
  .post-image{width:100%; max-height:440px; object-fit:cover; border-radius:10px; display:block; background:#EEF0F4;}
  .post-actions{display:flex; gap:8px; margin-top:8px; align-items:center;}
  .vote-btn{
    background:#F1F2F6; color:var(--text); border:none;
    border-radius:8px; padding:6px 12px; font-size:13px; font-weight:600; cursor:pointer;
  }
  .vote-btn.active-like{background:var(--green-light); color:var(--green);}
  .vote-btn.active-dislike{background:var(--red-light); color:var(--red);}

  /* COMMENTS MODAL */
  #commentsOverlay{position:fixed; inset:0; background:rgba(20,22,35,0.45); z-index:198; opacity:0; pointer-events:none; transition:opacity .18s ease;}
  #commentsOverlay.open{opacity:1; pointer-events:auto;}
  #commentsModal{
    position:fixed; left:0; right:0; bottom:0; max-width:640px; margin:0 auto;
    background:var(--panel); z-index:199; border-radius:16px 16px 0 0;
    transform:translateY(100%); transition:transform .22s ease;
    display:flex; flex-direction:column; max-height:75vh;
    box-shadow:0 -4px 24px rgba(0,0,0,0.18);
  }
  #commentsModal.open{transform:translateY(0);}
  #commentsHeader, .modal-header{display:flex; justify-content:space-between; align-items:center; padding:12px 14px; border-bottom:1px solid var(--border); font-weight:700;}
  #commentsList{flex:1; overflow-y:auto; padding:8px 14px;}
  .comment-item{display:flex; gap:9px; padding:9px 0; border-bottom:1px solid #F1F2F6;}
  .comment-item:last-child{border-bottom:none;}
  .comment-body b{font-size:13px;}
  .comment-text{font-size:13.5px; margin-top:2px; white-space:pre-wrap; word-break:break-word;}
  .comment-meta{font-size:11px; color:var(--text-mute); margin-top:2px;}
  #commentInputRow{display:flex; gap:8px; padding:10px 14px; border-top:1px solid var(--border);}
  #commentInputRow input{flex:1;}

  /* REPORT MODAL */
  #reportOverlay{position:fixed; inset:0; background:rgba(20,22,35,0.45); z-index:198; opacity:0; pointer-events:none; transition:opacity .18s ease;}
  #reportOverlay.open{opacity:1; pointer-events:auto;}
  #reportModal{
    position:fixed; left:0; right:0; bottom:0; max-width:500px; margin:0 auto;
    background:var(--panel); z-index:199; border-radius:16px 16px 0 0;
    transform:translateY(100%); transition:transform .22s ease;
    box-shadow:0 -4px 24px rgba(0,0,0,0.18);
  }
  #reportModal.open{transform:translateY(0);}

  /* ADMIN */
  .report-group{border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:10px;}
  .report-group.banned{border-color:var(--red); background:var(--red-light);}
  .report-line{font-size:12.5px; color:var(--text-mute); border-top:1px solid var(--border); padding-top:6px; margin-top:6px;}

  /* IMMERSIVE (short video/gif/image) FEED */
  #immersiveFeed{scroll-snap-type:y mandatory; overflow-y:auto; height:72vh; border-radius:14px; background:#000;}
  .immersive-item{
    position:relative; scroll-snap-align:start; height:72vh; width:100%; overflow:hidden;
    display:flex; align-items:center; justify-content:center; background:#000;
  }
  .immersive-media{width:100%; height:100%; object-fit:cover; display:block;}
  .immersive-overlay{position:absolute; left:0; right:66px; bottom:0; padding:14px; color:#fff; background:linear-gradient(to top, rgba(0,0,0,0.65), transparent 70%);}
  .immersive-author{display:flex; align-items:center; gap:8px; margin-bottom:6px; font-size:14px;}
  .immersive-author .avatar{width:32px; height:32px; border:2px solid #fff;}
  .immersive-text{font-size:13.5px; white-space:pre-wrap; word-break:break-word;}
  .immersive-actions{position:absolute; right:10px; bottom:16px; display:flex; flex-direction:column; gap:14px; align-items:center;}
  .imv-btn{background:rgba(20,22,35,0.45); color:#fff; border-radius:50%; width:44px; height:44px; font-size:15px; padding:0; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.15;}
  .imv-btn.active-like{color:var(--green);}
  .imv-btn.active-dislike{color:var(--red);}

  /* COMMUNITY BANNER */
  .comm-banner{
    height:140px; background-size:cover; background-position:center;
    background-color:var(--primary-light);
    display:flex; align-items:flex-end; padding:14px; position:relative;
  }
  .comm-banner .title{
    background:rgba(20,20,30,0.55); color:#fff; padding:6px 12px; border-radius:8px;
    font-size:19px; font-weight:800; -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px);
  }
  .comm-info{padding:12px 14px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;}
  .comm-tabs{display:flex; gap:4px; border-bottom:1px solid var(--border); padding:0 14px;}
  .comm-tabs button{
    background:none; border:none; color:var(--text-mute); font-size:14px;
    border-bottom:2.5px solid transparent; border-radius:0; padding:10px 8px;
  }
  .comm-tabs button.on{color:var(--primary); border-bottom-color:var(--primary);}

  /* GRID for explore */
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); gap:10px; padding:14px;}
  .comm-card{
    border:1px solid var(--border); border-radius:12px; overflow:hidden; background:#fff; cursor:pointer;
    transition:box-shadow .15s ease;
  }
  .comm-card:hover{box-shadow:0 4px 14px rgba(20,22,35,0.1);}
  .comm-card .thumb{height:72px; background-size:cover; background-position:center; background-color:var(--primary-light);}
  .comm-card .cc-body{padding:8px 10px;}
  .comm-card .cc-name{font-weight:700; font-size:13px; color:var(--text);}
  .comm-card .cc-cat{font-size:11.5px; color:var(--text-mute);}

  /* FORM */
  .field{margin-bottom:12px; display:flex; flex-direction:column; gap:5px;}
  .field label{font-weight:600; font-size:12.5px; color:var(--text-mute);}
  textarea{resize:vertical; min-height:64px;}

  /* PROFILE */
  .profile-head{display:flex; gap:14px; padding:16px 14px; align-items:center;}
  .profile-stats{display:flex; gap:16px; font-size:13px; color:var(--text-mute); margin-top:6px; flex-wrap:wrap;}
  .profile-stats b{color:var(--text);}

  /* MESSAGES */
  .friend-row{display:flex; align-items:center; gap:10px; padding:11px 14px; border-bottom:1px solid var(--border); cursor:pointer;}
  .friend-row:last-child{border-bottom:none;}
  .friend-row:hover{background:#FAFBFD;}
  #chatBox{height:380px; overflow-y:auto; padding:10px; background:#FAFBFD; border:1px solid var(--border); border-radius:12px;}
  .msg{max-width:78%; margin-bottom:7px; padding:8px 12px; border-radius:14px; font-size:14px; word-break:break-word;}
  .msg.me{background:var(--primary); color:#fff; margin-left:auto; border-bottom-right-radius:4px;}
  .msg.them{background:#fff; border:1px solid var(--border); border-bottom-left-radius:4px;}
  #chatInputRow{display:flex; gap:8px; margin-top:8px;}
  #chatInputRow input{flex:1;}

  /* LIVE */
  .live-row{display:flex; align-items:center; gap:10px; padding:11px 14px; border-bottom:1px solid var(--border); cursor:pointer;}
  .live-row:last-child{border-bottom:none;}
  .live-row:hover{background:var(--bg);}
  .live-dot{width:9px;height:9px;border-radius:50%;background:var(--red);display:inline-block;box-shadow:0 0 0 3px var(--red-light);}
  .live-video-wrap{background:#000;border-radius:12px;overflow:hidden;position:relative;}
  .live-video-wrap video{width:100%;max-height:60vh;display:block;background:#000;}
  .live-stats{position:absolute;top:10px;left:10px;display:flex;gap:8px;}
  .live-stat-pill{background:rgba(0,0,0,0.55);color:#fff;font-size:12px;font-weight:700;border-radius:20px;padding:4px 10px;display:flex;align-items:center;gap:5px;}
  #liveChatBox{height:260px;overflow-y:auto;padding:10px;background:#FAFBFD;border:1px solid var(--border);border-radius:12px;margin-top:10px;}
  .live-chat-msg{font-size:13.5px;margin-bottom:6px;word-break:break-word;}
  .live-chat-msg b{color:var(--primary);margin-right:4px;}

  .empty{padding:22px; text-align:center; color:var(--text-mute); font-size:14px;}
  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--text); color:#fff; padding:10px 18px; border-radius:10px;
    font-size:13.5px; z-index:200; box-shadow:0 4px 16px rgba(0,0,0,0.2);
  }
  #videoWarn{font-size:12px; color:var(--red);}

  @media (min-width:700px){
    #layout{padding-top:22px;}
  }

  /* THEME CUSTOMIZER */
  .color-field{display:flex; align-items:center; gap:10px;}
  .color-field input[type=color]{width:42px; height:38px; padding:2px; border-radius:8px; cursor:pointer;}
  details.advanced-css{margin-top:4px;}
  details.advanced-css summary{cursor:pointer; font-weight:600; font-size:12.5px; color:var(--text-mute); padding:6px 0;}

  /* HUB */
  #hubBar{
    position:sticky; top:0; z-index:60; background:var(--text); color:#fff;
    display:flex; align-items:center; gap:10px; padding:8px 12px;
  }
  #hubBar button{background:rgba(255,255,255,0.15);}
  #hubBar button:hover{background:rgba(255,255,255,0.25);}
  #hubBar .hub-title{font-weight:700; font-size:13.5px; flex:1;}
  #hubFrameWrap{height:calc(100vh - 50px);}
  #hubFrameWrap iframe{width:100%; height:100%; border:none; background:#000;}
  .hub-fallback{padding:30px 16px; text-align:center;}

  /* GIF PICKER */
  #gifPickerPanel{
    display:none; max-height:180px; overflow-y:auto; padding:8px 14px; border-top:1px solid var(--border);
    grid-template-columns:repeat(auto-fill, minmax(64px,1fr)); gap:6px;
  }
  #gifPickerPanel.open{display:grid;}
  #gifPickerPanel img{width:100%; height:56px; object-fit:cover; border-radius:6px; cursor:pointer; border:1px solid var(--border);}
  #gifPickerPanel img:hover{outline:2px solid var(--primary);}
  .gif-pack-card{border:1px solid var(--border); border-radius:12px; padding:10px; margin-bottom:10px;}
  .gif-pack-thumbs{display:grid; grid-template-columns:repeat(auto-fill, minmax(56px,1fr)); gap:5px; margin-top:6px;}
  .gif-pack-thumbs img{width:100%; height:48px; object-fit:cover; border-radius:5px;}
  .comment-gif{max-width:160px; border-radius:8px; margin-top:4px; display:block;}

  /* COMMENT LIKES + REPLIES */
  .comment-item{flex-direction:column; align-items:stretch;}
  .comment-row{display:flex; gap:9px;}
  .comment-actions{display:flex; gap:12px; margin-top:3px;}
  .comment-actions button{background:none; box-shadow:none; padding:0; font-size:11.5px; font-weight:600; color:var(--text-mute); border-radius:0;}
  .comment-actions button.liked{color:var(--red);}
  .comment-actions button.cmt-delete{color:var(--red);}
  .comment-replies{margin-left:36px; margin-top:6px; display:flex; flex-direction:column; gap:8px;}
  .reply-input-row{display:none; gap:6px; margin-top:6px; margin-left:36px;}
  .reply-input-row.open{display:flex;}
  .reply-input-row input{flex:1;}

  /* PEOPLE SEARCH */
  .person-row{display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--border); cursor:pointer;}
  .person-row:last-child{border-bottom:none;}
  .person-row:hover{background:var(--bg);}
  .explore-subtabs{display:flex; gap:6px; padding:0 14px 10px;}
  .explore-subtabs button{background:#EEF0F4; color:var(--text-mute); padding:6px 14px; border-radius:20px; font-size:12.5px;}
  .explore-subtabs button.on{background:var(--primary); color:#fff;}
</style>
</head>

function esc(s){

}
function timeAgo(ts){
  if(!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const s = Math.floor((Date.now()-d.getTime())/1000);
  if(s<60) return 'à l\'instant';
  if(s<3600) return Math.floor(s/60)+' min';
  if(s<86400) return Math.floor(s/3600)+' h';
  return Math.floor(s/86400)+' j';
}
function slugify(name){

}
function fileToBase64(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}
function resizeImageBase64(file, maxW=500, quality=0.72){
  return new Promise((res,rej)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onload = e=>{
      img.onload = ()=>{
        const scale = Math.min(1, maxW/img.width);
        const c = document.createElement('canvas');
        c.width = img.width*scale; c.height = img.height*scale;
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg', quality));
      };
      img.onerror = rej;
      img.src = e.target.result;
    };
    reader.onerror = rej;
    reader.readAsDataURL(file);
  });
}

function supportsVideoCompression(){
  return typeof MediaRecorder !== 'undefined' && typeof HTMLCanvasElement.prototype.captureStream === 'function';
}

function compressVideoFile(file, opts){
  return new Promise((resolve, reject)=>{
    if(!supportsVideoCompression()){ reject(new Error('unsupported')); return; }
    const video = document.createElement('video');
    video.muted = true; video.playsInline = true; video.src = URL.createObjectURL(file);
    video.onloadedmetadata = ()=>{
      const scale = Math.min(1, opts.maxWidth / video.videoWidth);
      const w = Math.max(2, Math.round(video.videoWidth * scale));
      const h = Math.max(2, Math.round(video.videoHeight * scale));
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      const canvasStream = canvas.captureStream(24);
      let outStream = canvasStream;
      try{
        const srcStream = video.captureStream ? video.captureStream() : null;
        const audioTracks = srcStream ? srcStream.getAudioTracks() : [];
        if(audioTracks.length){ outStream = new MediaStream([...canvasStream.getVideoTracks(), ...audioTracks]); }
      }catch(e){}
      const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9'
        : (MediaRecorder.isTypeSupported('video/webm;codecs=vp8') ? 'video/webm;codecs=vp8' : 'video/webm');
      let recorder;
      try{ recorder = new MediaRecorder(outStream, {mimeType, videoBitsPerSecond: opts.bitrate}); }
      catch(e){ reject(e); return; }
      const chunks = [];
      recorder.ondataavailable = e=>{ if(e.data.size) chunks.push(e.data); };
      recorder.onstop = ()=>{ URL.revokeObjectURL(video.src); resolve(new Blob(chunks, {type:'video/webm'})); };
      recorder.onerror = e=> reject(e.error||new Error('recorder error'));
      let raf;
      function draw(){ ctx.drawImage(video, 0, 0, w, h); raf = requestAnimationFrame(draw); }
      video.onplay = ()=> draw();
      video.onended = ()=>{ cancelAnimationFrame(raf); recorder.stop(); };
      recorder.start();
      video.play().catch(reject);
    };
    video.onerror = ()=> reject(new Error('video load error'));
  });
}

const MEDIA_BASE64_LIMIT = 880000; // stays safely under Firestore's ~1MiB document limit

async function prepareMedia(file, onStatus){
  if(file.type.startsWith('image')){
    let quality=0.75, maxW=800;
    let base64 = await resizeImageBase64(file, maxW, quality);
    let tries=0;
    while(base64.length > MEDIA_BASE64_LIMIT && tries<5){
      onStatus && onStatus('Compression de l\'image... ('+(tries+1)+')');
      quality = Math.max(0.3, quality-0.15); maxW = Math.round(maxW*0.75);
      base64 = await resizeImageBase64(file, maxW, quality);
      tries++;
    }
    if(base64.length > MEDIA_BASE64_LIMIT) throw new Error('Impossible de compresser cette image assez. Essaie une image plus légère.');
    return {base64, mediaType:'image'};
  }
  // video
  if(file.size <= MEDIA_BASE64_LIMIT*0.7){
    const base64 = await fileToBase64(file);
    if(base64.length <= MEDIA_BASE64_LIMIT) return {base64, mediaType:'video'};
  }
  if(supportsVideoCompression()){
    const attempts = [
      {maxWidth:480, bitrate:350000},
      {maxWidth:360, bitrate:220000},
      {maxWidth:240, bitrate:130000},
    ];
    for(const opt of attempts){
      try{
        onStatus && onStatus('Compression de la vidéo (~'+opt.maxWidth+'p)...');
        const blob = await compressVideoFile(file, opt);
        const base64 = await new Promise((res,rej)=>{
          const r = new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(blob);
        });
        if(base64.length <= MEDIA_BASE64_LIMIT) return {base64, mediaType:'video'};
      }catch(e){ console.warn('Échec de compression vidéo', e); }
    }
  }
  throw new Error('Cette vidéo reste trop lourde même compressée. Essaie une vidéo plus courte.');
}

let soundsOn = true;
(function initSoundPref(){
  const ls = safeLS();
  soundsOn = ls ? ls.getItem('2yap_sound') !== 'off' : true;
})();
let audioCtx = null;
function playSound(kind){
  if(!soundsOn) return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const now = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    let freq=440, dur=0.09, type='sine', vol=0.05;
    if(kind==='like'){ freq=660; dur=0.08; type='sine'; }
    else if(kind==='send'){ freq=520; dur=0.07; type='sine'; }
    else if(kind==='publish'){ freq=440; dur=0.14; type='sine'; }
    else if(kind==='open'){ freq=380; dur=0.06; type='sine'; }
    else if(kind==='error'){ freq=180; dur=0.18; type='triangle'; }
    o.type = type; o.frequency.setValueAtTime(freq, now);
    g.gain.setValueAtTime(vol, now);
    g.gain.exponentialRampToValueAtTime(0.001, now+dur);
    o.start(now); o.stop(now+dur+0.02);
    if(kind==='publish'){
      const o2 = audioCtx.createOscillator(); const g2 = audioCtx.createGain();
      o2.connect(g2); g2.connect(audioCtx.destination);
      o2.type='sine'; o2.frequency.setValueAtTime(660, now+0.1);
      g2.gain.setValueAtTime(0.05, now+0.1);
      g2.gain.exponentialRampToValueAtTime(0.001, now+0.26);
      o2.start(now+0.1); o2.stop(now+0.3);
    }
  }catch(e){}
}

  const btn = document.getElementById('soundToggleBtn');

  commentsUnsub = db.collection('posts').doc(postId).collection('comments').orderBy('createdAt','asc')
    .onSnapshot(snap=>{
      const all = []; snap.forEach(d=> all.push({id:d.id, ...d.data()}));
      if(all.length===0){ list.innerHTML='<div class="empty">Aucun commentaire. Sois le premier !</div>'; return; }

        list.appendChild(renderCommentNode(cm, repliesOf(cm.id)));
      });

function renderCommentNode(cm, replies){
  const wrap = document.createElement('div');
  wrap.className='comment-item';
  const liked = (cm.likes||[]).includes(currentUser.uid);
  wrap.innerHTML = `
    <div class="comment-row">
      <img class="avatar" style="width:28px;height:28px;border-radius:8px;" src="${cm.authorAvatar||fallbackAvatar()}">
      <div class="comment-body" style="flex:1;">
        <b>${esc(cm.authorPseudo)}</b>
        ${cm.text? `<div class="comment-text">${esc(cm.text)}</div>`:''}
        ${cm.gifUrl? `<img class="comment-gif" src="${esc(cm.gifUrl)}">`:''}
        <div class="comment-meta">${timeAgo(cm.createdAt)}</div>
        <div class="comment-actions">
          <button class="cmt-like ${liked?'liked':''}">❤️ ${(cm.likes||[]).length}</button>
          <button class="cmt-reply">Répondre</button>
          ${(cm.authorUid===currentUser.uid || isAdmin())? `<button class="cmt-delete">🗑️</button>`:''}
        </div>
        <div class="reply-input-row" id="replyRow-${cm.id}">
          <input placeholder="Répondre à ${esc(cm.authorPseudo)}...">
          <button class="small">Envoyer</button>
        </div>
      </div>
    </div>
  `;
  wrap.querySelector('.cmt-like').onclick = ()=> toggleCommentLike(cm.id);
  wrap.querySelector('.cmt-delete')?.addEventListener('click', ()=> deleteComment(cm.id));
  const replyRow = wrap.querySelector('.reply-input-row');
  wrap.querySelector('.cmt-reply').onclick = ()=> replyRow.classList.toggle('open');
  const replyInput = replyRow.querySelector('input');
  const replySend = ()=> sendCommentText(replyInput.value.trim(), cm.id, replyInput);
  replyRow.querySelector('button').onclick = replySend;
  replyInput.addEventListener('keydown', e=>{ if(e.key==='Enter') replySend(); });
  if(replies && replies.length){
    const repliesWrap = document.createElement('div');
    repliesWrap.className='comment-replies';
    replies.forEach(r=> repliesWrap.appendChild(renderCommentNode(r, [])));
    wrap.appendChild(repliesWrap);
  }
  return wrap;
}

async function toggleCommentLike(commentId){
  const ref = db.collection('posts').doc(commentsCurrentPostId).collection('comments').doc(commentId);
  playSound('like');
  await db.runTransaction(async t=>{
    const doc = await t.get(ref);
    if(!doc.exists) return;
    let likes = doc.data().likes||[];
    const uid = currentUser.uid;
    likes = likes.includes(uid) ? likes.filter(u=>u!==uid) : [...likes, uid];
    t.update(ref, {likes});
  });
}

async function deleteComment(commentId){
  if(!commentsCurrentPostId) return;
  if(!confirm('Supprimer ce commentaire ?')) return;
  try{
    const postId = commentsCurrentPostId;
    const repliesSnap = await db.collection('posts').doc(postId).collection('comments').where('parentId','==',commentId).get();
    if(!repliesSnap.empty){
      const batch = db.batch();
      repliesSnap.forEach(d=> batch.delete(d.ref));
      await batch.commit();
    }
    await db.collection('posts').doc(postId).collection('comments').doc(commentId).delete();
  }catch(err){ toast('Erreur : '+err.message); }
}

    likes:[], createdAt: firebase.firestore.FieldValue.serverTimestamp()

async function checkAutoBan(uid){
  try{
    const userDoc = await db.collection('users').doc(uid).get();
    if(!userDoc.exists) return;
    const email = (userDoc.data().email||'').toLowerCase();
    if(ADMIN_EMAILS.includes(email)) return; // jamais les admins
    const reportsSnap = await db.collection('reports').where('reportedUid','==',uid).get();
    if(reportsSnap.size >= BAN_THRESHOLD && !userDoc.data().banned){
      await db.collection('users').doc(uid).update({banned:true, banType:'normal'});
    }
  }catch(e){ console.warn('checkAutoBan', e); }
}

window.addEventListener('hashchange', router);
function router(){
  clearListeners();
  const main = document.getElementById('main-col');
  main.innerHTML = '';
  const hash = location.hash.replace('#','');
  const [route, arg, arg2] = hash.split('/');
  if(!currentUser) return;
  if(route==='home' || route===''){ renderHome(main); }
  else if(route==='scroll'){ renderScroll(main); }
  else if(route==='live'){ if(arg) renderLiveRoom(main, arg); else renderLiveHub(main); }
  else if(route==='explore'){ renderExplore(main, arg?decodeURIComponent(arg):''); }
  else if(route==='community'){ renderCommunity(main, arg); }
  else if(route==='create-community'){ renderCreateCommunity(main); }
  else if(route==='profile'){ renderProfile(main, arg||currentUser.uid); }
  else if(route==='messages'){ renderMessages(main); }
  else if(route==='chat'){ renderChat(main, arg); }
  else if(route==='hub'){ renderHub(main, arg); }
  else if(route==='community-settings'){ renderCommunitySettings(main, arg); }
  else if(route==='admin'){ renderAdmin(main); }
  else if(route==='people'){ renderPeople(main); }
  else if(route==='gif-packs'){ renderGifPacks(main); }
  else { renderHome(main); }
}

/* ---------------- NOTIFICATIONS ---------------- */
let notifUnsub = null;
let notifFirstSnapshot = true;
let notifPermissionAsked = false;

function listenNotifications(){
  notifFirstSnapshot = true;
  if(notifUnsub) notifUnsub();
  notifUnsub = db.collection('notifications').where('toUid','==',currentUser.uid).limit(100)
    .onSnapshot(snap=>{
      const items = []; snap.forEach(d=> items.push({id:d.id, ...d.data()}));
      items.sort((a,b)=> (b.createdAt? b.createdAt.toMillis():Date.now()) - (a.createdAt? a.createdAt.toMillis():Date.now()));
      const unread = items.filter(n=>!n.read).length;
      const badge = document.getElementById('notifBadge');
      if(badge){ badge.textContent = unread>9?'9+':unread; badge.classList.toggle('hidden', unread===0); }
      window._latestNotifs = items;
      const list = document.getElementById('notifList');
      if(list && document.getElementById('notifPanel').classList.contains('open')) renderNotifList(items);
      if(!notifFirstSnapshot){
        snap.docChanges().forEach(ch=>{
          if(ch.type==='added'){
            const n = {id:ch.doc.id, ...ch.doc.data()};
            fireNativeNotification(n);
          }
        });
      }
      notifFirstSnapshot = false;
    }, err=> console.warn('notifications', err));
}

function fireNativeNotification(n){
  playSound('open');
  if(typeof Notification==='undefined' || Notification.permission!=='granted') return;
  try{
    const notif = new Notification('2Yap', {body: n.text, tag: n.id});
    notif.onclick = ()=>{ window.focus(); goToNotif(n); };
  }catch(e){}
}

function renderNotifList(items){
  const list = document.getElementById('notifList');
  if(!list) return;
  if(items.length===0){ list.innerHTML = '<div class="empty">Aucune notification.</div>'; return; }
  list.innerHTML = '';
  items.forEach(n=>{
    const el = document.createElement('div');
    el.className = 'notif-item'+(n.read?'':' unread');
    el.innerHTML = `
      <img class="avatar" style="width:32px;height:32px;" src="${n.fromAvatar||fallbackAvatar()}">
      <div>
        <div class="notif-text">${esc(n.text)}</div>
        <div class="notif-meta">${timeAgo(n.createdAt)}</div>
      </div>`;
    el.onclick = ()=>{ closeNotifPanel(); goToNotif(n); };
    list.appendChild(el);
  });
}

function goToNotif(n){
  if(!n.read) db.collection('notifications').doc(n.id).update({read:true}).catch(()=>{});
  if(n.link) location.hash = n.link;
}

function openNotifPanel(){
  document.getElementById('notifOverlay').classList.add('open');
  document.getElementById('notifPanel').classList.add('open');
  renderNotifList(window._latestNotifs||[]);
  const unreadIds = (window._latestNotifs||[]).filter(n=>!n.read).map(n=>n.id);
  if(unreadIds.length){
    const batch = db.batch();
    unreadIds.forEach(id=> batch.update(db.collection('notifications').doc(id), {read:true}));
    batch.commit().catch(()=>{});
  }
}
function closeNotifPanel(){
  document.getElementById('notifOverlay').classList.remove('open');
  document.getElementById('notifPanel').classList.remove('open');
}
document.getElementById('notifBtn').onclick = ()=>{
  document.getElementById('notifPanel').classList.contains('open') ? closeNotifPanel() : openNotifPanel();
};

function renderPostCard(id, p){
  const div = document.createElement('div');

  const disliked = (p.dislikes||[]).includes(currentUser.uid);
  div.innerHTML = `

      <img class="avatar" src="${p.authorAvatar||fallbackAvatar()}">
      <div>
        <div><a href="#profile/${p.authorUid}"><b>${esc(p.authorPseudo)}</b></a> · <a href="#community/${p.communityId}"><span class="ybadge">y/${esc(p.communitySlug||p.communityId)}</span></a></div>
        <div class="post-meta">${timeAgo(p.createdAt)}</div>
      </div>
    </div>
    ${p.text? `<div class="post-text">${esc(p.text)}</div>`:''}
    ${p.mediaType==='video'? `<video controls muted playsinline src="${p.mediaUrl||p.mediaBase64}"></video>` : ''}
    ${p.mediaType==='image'? `<img class="post-image" src="${p.mediaUrl||p.mediaBase64}">` : ''}
    <div class="post-actions">
      <button class="vote-btn ${liked?'active-like':''}" data-act="like">👍 ${(p.likes||[]).length}</button>
      <button class="vote-btn ${disliked?'active-dislike':''}" data-act="dislike">👎 ${(p.dislikes||[]).length}</button>
      <button class="vote-btn" data-act="comments">💬 <span class="cmt-count">···</span></button>
      ${p.authorUid!==currentUser.uid? `<button class="vote-btn" data-act="report" style="margin-left:auto;">🚩</button>`:''}
      ${(p.authorUid===currentUser.uid || isAdmin())? `<button class="vote-btn" data-act="delete" style="margin-left:${p.authorUid!==currentUser.uid?'6px':'auto'};color:var(--red);">🗑️</button>`:''}
    </div>
  `;
  div.querySelectorAll('.vote-btn').forEach(btn=>{
    btn.onclick = ()=>{
      if(btn.dataset.act==='comments') openComments(id);
      else if(btn.dataset.act==='delete') deletePost(id);
      else if(btn.dataset.act==='report') openReport(p.authorUid, p.authorPseudo, 'post', id);
      else vote(id, btn.dataset.act);
    };
  });
  db.collection('posts').doc(id).collection('comments').get().then(s=>{
    const el = div.querySelector('.cmt-count'); if(el) el.textContent = s.size;
  }).catch(()=>{});

function fallbackAvatar(){
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36"><rect width="36" height="36" fill="%23c7cdd6"/><text x="18" y="24" font-size="18" text-anchor="middle" fill="%233b5998">?</text></svg>'
  );
}

async function deletePost(postId){
  if(!confirm('Supprimer ce post ? Cette action est irréversible.')) return;
  try{
    const commentsSnap = await db.collection('posts').doc(postId).collection('comments').get();
    if(!commentsSnap.empty){
      const batch = db.batch();
      commentsSnap.forEach(d=> batch.delete(d.ref));
      await batch.commit();
    }
    await db.collection('posts').doc(postId).delete();
    toast('Post supprimé.');
  }catch(err){
    playSound('error');
    toast('Erreur : '+err.message);
  }
}

async function vote(postId, act){
  playSound('like');
  const ref = db.collection('posts').doc(postId);
  await db.runTransaction(async t=>{
    const doc = await t.get(ref);
    if(!doc.exists) return;
    const data = doc.data();
    let likes = data.likes||[]; let dislikes = data.dislikes||[];
    const uid = currentUser.uid;
    if(act==='like'){
      if(likes.includes(uid)) likes = likes.filter(u=>u!==uid);
      else { likes.push(uid); dislikes = dislikes.filter(u=>u!==uid); }
    } else {
      if(dislikes.includes(uid)) dislikes = dislikes.filter(u=>u!==uid);
      else { dislikes.push(uid); likes = likes.filter(u=>u!==uid); }
    }
    t.update(ref, {likes, dislikes});
  });
}

    const body = document.getElementById('scrollBody');
    if(!body) return;
    if(ids.length===0){ body.innerHTML = '<div class="empty">Rejoins une communauté pour voir son contenu ici.</div>'; return; }
    subscribeScrollFeed(ids);
  }).catch(err=>{
    const b = document.getElementById('scrollBody');
    if(b) b.innerHTML = '<div class="empty">Erreur : '+esc(err.message)+'</div>';
  });
}

function subscribeScrollFeed(ids){
  const un = db.collection('posts').orderBy('createdAt','desc').limit(scrollBatchSize).onSnapshot(snap=>{
    const reachedEnd = snap.size < scrollBatchSize;
    let posts = []; snap.forEach(d=> posts.push({id:d.id, ...d.data()}));
    posts = posts.filter(p=> ids.includes(p.communityId) && (p.mediaType==='video'||p.mediaType==='image'));
    const container = document.getElementById('scrollBody');
    if(container) renderImmersiveFeed(container, posts, reachedEnd? null : ()=>{
      scrollBatchSize += 20;
      subscribeScrollFeed(ids);
    });
  }, err=>{
    console.error(err);
    const b = document.getElementById('scrollBody');
    if(b) b.innerHTML = '<div class="empty">Erreur : '+esc(err.message)+'</div>';
  });
  unsubscribers.push(un);
}

async function maybeDeleteEmptyCommunity(slug){
  try{
    const doc = await db.collection('communities').doc(slug).get();
    if(!doc.exists) return;
    const members = doc.data().members||[];
    if(members.length===0){
      const postsSnap = await db.collection('posts').where('communityId','==',slug).get();
      const batch = db.batch();
      postsSnap.forEach(p=> batch.delete(p.ref));
      if(!postsSnap.empty) await batch.commit();
      await db.collection('communities').doc(slug).delete();
      toast('Plus personne dans y/'+slug+', elle a été supprimée.');
    }
  }catch(e){ console.warn('maybeDeleteEmptyCommunity', e); }
}

function listenCommunityFeed(slug, c){
  const feed = document.getElementById('communityFeed');
  const un = db.collection('posts').where('communityId','==',slug)
    .onSnapshot(snap=>{
      let posts = []; snap.forEach(d=> posts.push({id:d.id, ...d.data()}));
      posts.sort((a,b)=> (b.createdAt? b.createdAt.toMillis():Date.now()) - (a.createdAt? a.createdAt.toMillis():Date.now()));
      if(communityTab==='video'){
        const shorts = posts.filter(p=>p.mediaType==='video'||p.mediaType==='image');
        renderImmersiveFeed(feed, shorts);
      } else {
        renderCommunityFeed(feed, posts, c);
      }
    }, err=>{
      console.error(err);
      if(feed) feed.innerHTML = '<div class="empty">Erreur de chargement du fil : '+esc(err.message)+'</div>';
    });
  unsubscribers.push(un);
}

async function renderCommunityFeed(feed, posts, c){

  const counts = await Promise.all(posts.map(p=> db.collection('posts').doc(p.id).collection('comments').get().then(s=>s.size).catch(()=>0)));
  // Render via sandboxed iframe so community custom CSS only affects this feed
  const postsHtml = posts.map((p,i)=>`
    <div class="post" data-id="${p.id}">
      <div class="post-head">
        <img class="post-avatar" src="${p.authorAvatar||fallbackAvatar()}" style="width:32px;height:32px;border-radius:4px;">
        <div>
          <div class="post-author">${esc(p.authorPseudo)}</div>
          <div class="post-meta">${timeAgo(p.createdAt)}</div>
        </div>
      </div>
      ${p.text? `<div class="post-text">${esc(p.text)}</div>`:''}
      ${p.mediaType==='video'? `<video controls muted playsinline src="${p.mediaUrl||p.mediaBase64}"></video>`:''}
      ${p.mediaType==='image'? `<img class="post-image" src="${p.mediaUrl||p.mediaBase64}">`:''}
      <div class="post-actions">
        <button class="post-likes" onclick="parent.postMessage({type:'vote',id:'${p.id}',act:'like'},'*')">👍 ${(p.likes||[]).length}</button>
        <button class="post-dislikes" onclick="parent.postMessage({type:'vote',id:'${p.id}',act:'dislike'},'*')">👎 ${(p.dislikes||[]).length}</button>
        <button class="post-comments" onclick="parent.postMessage({type:'comments',id:'${p.id}'},'*')">💬 ${counts[i]}</button>
        ${p.authorUid!==currentUser.uid? `<button class="post-report" data-uid="${esc(p.authorUid)}" data-pseudo="${esc(p.authorPseudo)}" data-target="${esc(p.id)}">🚩</button>`:''}
        ${(p.authorUid===currentUser.uid || isAdmin())? `<button class="post-delete" onclick="parent.postMessage({type:'delete',id:'${p.id}'},'*')">🗑️</button>`:''}
      </div>
    </div>
  `).join('');
  const baseCss = `
    body{font-family:Verdana,Arial,sans-serif;font-size:12.5px;margin:0;color:#1c2b4a;background:#fff;}
    .post{border-bottom:1px solid #e3e6ec;padding:10px;}

    .post-author{font-weight:bold;}
    .post-meta{font-size:11px;color:#5b6b8c;}
    .post-text{margin:4px 0 6px;white-space:pre-wrap;word-break:break-word;}
    video, .post-image{width:100%;max-height:420px;border-radius:4px;background:#000;object-fit:cover;}
    .post-actions{display:flex;gap:8px;margin-top:6px;}
    .post-actions button{font-family:inherit;font-size:11px;font-weight:bold;border:1px solid #c7cdd6;background:#eef1f6;border-radius:3px;padding:3px 8px;cursor:pointer;}
    .post-delete{margin-left:auto;color:#b83c3c;border-color:#e3b8b8;}
    .post-report{margin-left:auto;}
  `;
  const iframe = document.createElement('iframe');
  iframe.sandbox = 'allow-scripts';
  iframe.style.width='100%'; iframe.style.border='none'; iframe.style.minHeight='400px';
  iframe.srcdoc = `<html><head><style>${baseCss}\n${c.customCSS||''}</style></head><body>${postsHtml}
    <script>
      const ro = new ResizeObserver(()=> parent.postMessage({type:'resize', h: document.body.scrollHeight}, '*'));
      ro.observe(document.body);
      document.querySelectorAll('.post-report').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          parent.postMessage({type:'report', uid:btn.dataset.uid, pseudo:btn.dataset.pseudo, targetType:'post', targetId:btn.dataset.target}, '*');
        });
      });
    <\/script>
  </body></html>`;
  feed.innerHTML='';
  feed.appendChild(iframe);
}

/* ---------------- IMMERSIVE SHORT-FORM FEED ---------------- */
function renderImmersiveFeed(container, posts, onLoadMore){
  if(!container) return;
  if(posts.length===0){ container.innerHTML = '<div class="empty">Aucun contenu court pour le moment. Poste une photo, un GIF ou une vidéo !</div>'; return; }
  container.innerHTML = '<div id="immersiveFeed"></div>';
  const feedEl = document.getElementById('immersiveFeed');
  posts.forEach(p=>{
    const liked = (p.likes||[]).includes(currentUser.uid);
    const disliked = (p.dislikes||[]).includes(currentUser.uid);
    const item = document.createElement('div');
    item.className = 'immersive-item';
    item.innerHTML = `
      ${p.mediaType==='video'
        ? `<video class="immersive-media" loop playsinline muted src="${p.mediaUrl||p.mediaBase64}"></video>`
        : `<img class="immersive-media" src="${p.mediaUrl||p.mediaBase64}">`}
      <div class="immersive-overlay">
        <div class="immersive-author"><img class="avatar" src="${p.authorAvatar||fallbackAvatar()}"><b>${esc(p.authorPseudo)}</b> <a href="#community/${p.communityId}" style="color:#fff;opacity:0.85;" onclick="event.stopPropagation()">· y/${esc(p.communitySlug||p.communityId)}</a></div>
        ${p.text? `<div class="immersive-text">${esc(p.text)}</div>`:''}
      </div>
      <div class="immersive-actions">
        <button class="imv-btn ${liked?'active-like':''}" data-act="like">👍<br>${(p.likes||[]).length}</button>
        <button class="imv-btn ${disliked?'active-dislike':''}" data-act="dislike">👎<br>${(p.dislikes||[]).length}</button>
        <button class="imv-btn" data-act="comments">💬</button>
        ${p.mediaType==='video'? `<button class="imv-btn" data-act="mute">🔇</button>`:''}
        ${p.authorUid!==currentUser.uid? `<button class="imv-btn" data-act="report">🚩</button>`:''}
        ${(p.authorUid===currentUser.uid || isAdmin())? `<button class="imv-btn" data-act="delete" style="color:#ff8a8a;">🗑️</button>`:''}
      </div>
    `;
    item.querySelectorAll('.imv-btn').forEach(btn=>{
      btn.onclick = ()=>{
        if(btn.dataset.act==='like'||btn.dataset.act==='dislike') vote(p.id, btn.dataset.act);
        else if(btn.dataset.act==='comments') openComments(p.id);
        else if(btn.dataset.act==='mute') toggleImmersiveSound(item, btn);
        else if(btn.dataset.act==='delete') deletePost(p.id);
        else if(btn.dataset.act==='report') openReport(p.authorUid, p.authorPseudo, 'post', p.id);
      };
    });
    if(p.mediaType==='video' && p.musicUrl){
      const audio = document.createElement('audio');
      audio.src = p.musicUrl; audio.loop = true; audio.className='imv-audio'; audio.muted = true;
      item.appendChild(audio);
    }
    feedEl.appendChild(item);
  });
  setupImmersiveObserver(feedEl);
  if(onLoadMore){
    let triggered = false;
    feedEl.addEventListener('scroll', ()=>{
      if(triggered) return;
      if(feedEl.scrollTop + feedEl.clientHeight >= feedEl.scrollHeight - feedEl.clientHeight*1.5){
        triggered = true;
        onLoadMore();
      }
    });
  }
}

function toggleImmersiveSound(item, btn){
  const video = item.querySelector('video');
  const audio = item.querySelector('audio');
  if(audio){
    audio.muted = !audio.muted;
    if(video) video.muted = true;
    btn.innerHTML = audio.muted ? '🔇' : '🔊';
  } else if(video){
    video.muted = !video.muted;
    btn.innerHTML = video.muted ? '🔇' : '🔊';
  }
}

function setupImmersiveObserver(feedEl){
  const items = feedEl.querySelectorAll('.immersive-item');
  const obs = new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      const video = entry.target.querySelector('video');
      const audio = entry.target.querySelector('audio');
      if(entry.isIntersecting && entry.intersectionRatio > 0.6){
        if(video) video.play().catch(()=>{});
        if(audio){ audio.currentTime = video ? video.currentTime : 0; audio.play().catch(()=>{}); }
      } else {
        if(video) video.pause();
        if(audio) audio.pause();
      }
    });
  }, {threshold:[0,0.6,1], root:feedEl});
  items.forEach(it=> obs.observe(it));
}

window.addEventListener('message', async (e)=>{
  if(e.data && e.data.type==='vote'){ vote(e.data.id, e.data.act); }
  if(e.data && e.data.type==='comments'){ openComments(e.data.id); }
  if(e.data && e.data.type==='delete'){ deletePost(e.data.id); }
  if(e.data && e.data.type==='report'){ openReport(e.data.uid, e.data.pseudo, e.data.targetType, e.data.targetId); }
  if(e.data && e.data.type==='resize'){
    document.querySelectorAll('#communityFeed iframe').forEach(f=> f.style.height = e.data.h+'px');
  }
});

/* ---------------- ADMIN ---------------- */
function renderAdmin(main){
  if(!isAdmin()){
    main.innerHTML = '<div class="panel"><div class="empty">Accès réservé aux administrateurs.</div></div>';
    return;
  }
  main.innerHTML = '<div class="panel"><div class="panel-head">🛡️ Panneau admin — Signalements</div><div class="panel-body" id="adminBody"><div class="empty">Chargement...</div></div></div>';
  db.collection('reports').orderBy('createdAt','desc').limit(300).get().then(async snap=>{
    const reports = []; snap.forEach(d=> reports.push({id:d.id, ...d.data()}));
    const body = document.getElementById('adminBody');
    if(!body) return;
    if(reports.length===0){ body.innerHTML = '<div class="empty">Aucun signalement pour le moment.</div>'; return; }
    const grouped = {};
    reports.forEach(r=>{
      if(!grouped[r.reportedUid]) grouped[r.reportedUid] = {pseudo:r.reportedPseudo, items:[]};
      grouped[r.reportedUid].items.push(r);
    });
    const uids = Object.keys(grouped);
    const userDocs = await Promise.all(uids.map(uid=> db.collection('users').doc(uid).get()));
    body.innerHTML = '';
    uids.forEach((uid, i)=>{
      const g = grouped[uid];
      const exists = userDocs[i].exists;
      const udata = exists ? userDocs[i].data() : {};
      const banned = exists && udata.banned;
      const banType = udata.banType;
      let statusBadge = '';
      if(banned) statusBadge = banType==='def'
        ? '<span class="ybadge" style="color:var(--red);background:var(--red-light);">Banni définitivement</span>'
        : '<span class="ybadge" style="color:var(--red);background:var(--red-light);">Banni</span>';
      const card = document.createElement('div');
      card.className = 'report-group' + (banned? ' banned':'');
      if(!exists){
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div><b>${esc(g.pseudo)}</b> — ${g.items.length} signalement(s) <span class="ybadge" style="color:var(--red);background:var(--red-light);">Compte supprimé</span></div>
          </div>
          ${g.items.slice(0,5).map(r=> `<div class="report-line">Par ${esc(r.reporterPseudo)} · ${esc(r.reason)}${r.details? ' — '+esc(r.details):''} · ${timeAgo(r.createdAt)}</div>`).join('')}
        `;
        body.appendChild(card);
        return;
      }
      card.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;">
          <div><a href="#profile/${uid}"><b>${esc(g.pseudo)}</b></a> — ${g.items.length} signalement(s) ${statusBadge}</div>
          <div style="display:flex; gap:6px; flex-wrap:wrap;">
            ${banned
              ? `<button class="secondary small" data-act="unban">Débannir</button>`
              : `<button class="danger small" data-act="ban-normal">Bannir</button><button class="danger small" data-act="ban-def">Bannir déf.</button>`
            }
            <button class="danger small" data-act="delete-account">Supprimer le compte</button>
          </div>
        </div>
        ${g.items.slice(0,5).map(r=> `<div class="report-line">Par ${esc(r.reporterPseudo)} · ${esc(r.reason)}${r.details? ' — '+esc(r.details):''} · ${timeAgo(r.createdAt)}</div>`).join('')}
      `;
      card.querySelectorAll('button[data-act]').forEach(btn=>{
        btn.onclick = async ()=>{
          const act = btn.dataset.act;
          if(act==='unban'){
            await db.collection('users').doc(uid).update({banned:false, banType: firebase.firestore.FieldValue.delete()});
            toast('Utilisateur débanni.');
          } else if(act==='ban-normal'){
            await db.collection('users').doc(uid).update({banned:true, banType:'normal'});
            toast('Utilisateur banni.');
          } else if(act==='ban-def'){
            if(!confirm('Bannir définitivement cet utilisateur ? Cette décision est irrévocable.')) return;
            await db.collection('users').doc(uid).update({banned:true, banType:'def'});
            toast('Utilisateur banni définitivement.');
          } else if(act==='delete-account'){
            if(!confirm('Supprimer définitivement le compte de '+g.pseudo+' ? Cette action est irréversible.')) return;
            await db.collection('users').doc(uid).delete();
            toast('Compte supprimé.');
          }
          renderAdmin(main);
        };
      });
      body.appendChild(card);
    });
  }).catch(err=>{
    const body = document.getElementById('adminBody');
    if(body) body.innerHTML = '<div class="empty">Erreur : '+esc(err.message)+'</div>';
  });
}

/* ---------------- PROFILE ---------------- */
function renderProfile(main, uid){
  main.innerHTML = '<div class="empty">Chargement...</div>';
  db.collection('users').doc(uid).get().then(async doc=>{
    if(!doc.exists){ main.innerHTML='<div class="panel"><div class="empty">Profil introuvable.</div></div>'; return; }
    const u = doc.data();
    const isMe = uid===currentUser.uid;
    const iFollow = (u.followers||[]).includes(currentUser.uid);
    const followsMe = (u.following||[]).includes(currentUser.uid);
    const areFriends = iFollow && followsMe;
    main.innerHTML = `
      <div class="panel">
        <div class="profile-head">
          <img class="avatar lg" src="${u.avatar||fallbackAvatar()}">
          <div>
            <div style="font-size:17px;font-weight:bold;color:var(--blue-dark);">${esc(u.pseudo)}</div>
            <div class="post-meta">${esc(u.bio||'')}</div>
            <div class="profile-stats">
              <span><b>${(u.followers||[]).length}</b> abonnés</span>
              <span><b>${(u.following||[]).length}</b> abonnements</span>
              ${areFriends? '<span class="ybadge">Amis</span>':''}
            </div>
          </div>
        </div>
        <div class="panel-body" id="profileActions"></div>
      </div>
      ${isMe? `
      <div class="panel">
        <div class="panel-head">Modifier mon profil</div>
        <div class="panel-body">
          <div class="field"><label>Bio</label><textarea id="editBio">${esc(u.bio||'')}</textarea></div>
          <div class="field"><label>Avatar</label><input id="editAvatar" type="file" accept="image/*"></div>
          <button id="saveProfileBtn">Enregistrer</button>
        </div>
      </div>` : ''}
      <div class="panel">
        <div class="panel-head">Posts de ${esc(u.pseudo)}</div>
        <div class="panel-body" id="userPosts"><div class="empty">Chargement...</div></div>
      </div>`;
    const actions = document.getElementById('profileActions');
    if(!isMe){
      const btn = document.createElement('button');
      btn.textContent = iFollow ? 'Ne plus suivre' : 'Suivre';
      btn.className = iFollow ? 'secondary' : '';
      btn.onclick = async ()=>{
        const myRef = db.collection('users').doc(currentUser.uid);
        const theirRef = db.collection('users').doc(uid);
        if(iFollow){
          await myRef.update({following: firebase.firestore.FieldValue.arrayRemove(uid)});
          await theirRef.update({followers: firebase.firestore.FieldValue.arrayRemove(currentUser.uid)});
        }else{
          await myRef.update({following: firebase.firestore.FieldValue.arrayUnion(uid)});
          await theirRef.update({followers: firebase.firestore.FieldValue.arrayUnion(currentUser.uid)});
          createNotification(uid, currentUser.pseudo+' s\'est abonné(e) à toi.', '#profile/'+currentUser.uid);
        }
        const doc2 = await myRef.get(); currentUser = {uid:currentUser.uid, ...doc2.data()};
        renderProfile(main, uid);
      };
      actions.appendChild(btn);
      if(areFriends){
        const msgBtn = document.createElement('button');
        msgBtn.className='secondary'; msgBtn.style.marginLeft='6px';
        msgBtn.textContent='Envoyer un message';
        msgBtn.onclick = ()=> location.hash = '#chat/'+uid;
        actions.appendChild(msgBtn);
      }
      const reportBtn = document.createElement('button');
      reportBtn.className='secondary'; reportBtn.style.marginLeft='6px';
      reportBtn.textContent='🚩 Signaler';
      reportBtn.onclick = ()=> openReport(uid, u.pseudo, 'user', uid);
      actions.appendChild(reportBtn);
    }
    document.getElementById('saveProfileBtn')?.addEventListener('click', async ()=>{
      const bio = document.getElementById('editBio').value.trim();
      let avatar = currentUser.avatar||'';
      const f = document.getElementById('editAvatar').files[0];
      if(f) avatar = await resizeImageBase64(f, 200, 0.75);
      await db.collection('users').doc(uid).update({bio, avatar});
      currentUser.bio = bio; currentUser.avatar = avatar;
      updateTopbarAvatar();
      toast('Profil mis à jour.');
      renderProfile(main, uid);
    });
    db.collection('posts').where('authorUid','==',uid).get().then(snap=>{
      const box = document.getElementById('userPosts');
      if(!box) return;
      if(snap.empty){ box.innerHTML='<div class="empty">Aucun post.</div>'; return; }
      let posts = []; snap.forEach(d=> posts.push({id:d.id, ...d.data()}));
      posts.sort((a,b)=> (b.createdAt? b.createdAt.toMillis():0) - (a.createdAt? a.createdAt.toMillis():0));
      box.innerHTML='';
      posts.slice(0,30).forEach(p=> box.appendChild(renderPostCard(p.id, p)));
    }).catch(err=>{
      const box = document.getElementById('userPosts');
      if(box) box.innerHTML = '<div class="empty">Erreur de chargement : '+esc(err.message)+'</div>';
    });
  });
}

/* ---------------- MESSAGES (friends list) ---------------- */
function renderMessages(main){
  main.innerHTML = '<div class="panel"><div class="panel-head">Messages</div><div class="panel-body" id="friendsList"><div class="empty">Chargement...</div></div></div>';
  db.collection('users').doc(currentUser.uid).get().then(async doc=>{
    const u = doc.data();
    const following = u.following||[]; const followers = u.followers||[];
    const friendUids = following.filter(id=>followers.includes(id));
    const list = document.getElementById('friendsList');
    if(friendUids.length===0){ list.innerHTML='<div class="empty">Aucun ami mutuel pour le moment. Suis quelqu\'un qui te suit en retour !</div>'; return; }
    list.innerHTML='';
    for(const fid of friendUids){
      const fdoc = await db.collection('users').doc(fid).get();

      const row = document.createElement('div');
      row.className='friend-row';

      row.onclick = ()=> location.hash = '#chat/'+fid;

}

function chatId(a,b){ return [a,b].sort().join('_'); }

function renderChat(main, otherUid){
  main.innerHTML = '<div class="empty">Chargement...</div>';
  db.collection('users').doc(otherUid).get().then(doc=>{
    const ou = doc.data();
    main.innerHTML = `
      <div class="panel">
        <div class="panel-head"><a href="#messages">← Messages</a> · ${esc(ou.pseudo)}</div>
        <div class="panel-body">
          <div id="chatBox"></div>
          <div id="chatInputRow">
            <input id="chatInput" placeholder="Écris un message...">
            <button id="chatSendBtn">Envoyer</button>
          </div>
        </div>
      </div>`;
    const cid = chatId(currentUser.uid, otherUid);
    const un = db.collection('chats').doc(cid).collection('messages').orderBy('createdAt','asc').limit(200)
      .onSnapshot(snap=>{
        const box = document.getElementById('chatBox');
        if(!box) return;
        box.innerHTML='';
        snap.forEach(d=>{
          const m = d.data();
          const el = document.createElement('div');
          el.className = 'msg ' + (m.senderUid===currentUser.uid?'me':'them');
          el.textContent = m.text;
          box.appendChild(el);
        });
        box.scrollTop = box.scrollHeight;
      });
    unsubscribers.push(un);
    const send = async ()=>{
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if(!text) return;
      input.value='';
      playSound('send');
      await db.collection('chats').doc(cid).collection('messages').add({
        senderUid: currentUser.uid, text,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      createNotification(otherUid, currentUser.pseudo+' : '+text.slice(0,60), '#chat/'+currentUser.uid);
    };
    document.getElementById('chatSendBtn').onclick = send;
    document.getElementById('chatInput').addEventListener('keydown', e=>{ if(e.key==='Enter') send(); });
  });
}

const RTC_CONFIG = { iceServers: [
  {urls:'stun:stun.l.google.com:19302'},
  {urls:'stun:stun1.l.google.com:19302'}
]};

function genLiveCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // sans O/0, I/1
  let code = '';
  for(let i=0;i<6;i++) code += chars[Math.floor(Math.random()*chars.length)];
  return code;
}

async function startLive(){
  let code = genLiveCode();
  for(let i=0;i<5;i++){
    const existing = await db.collection('lives').doc(code).get();
    if(!existing.exists || existing.data().active===false) break;
    code = genLiveCode();
  }
  await db.collection('lives').doc(code).set({
    hostUid: currentUser.uid,
    hostPseudo: currentUser.pseudo,
    hostAvatar: currentUser.avatar||'',
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    active: true,
    viewerCount: 0
  });
  location.hash = '#live/'+code;
}

function renderLiveRoom(main, codeRaw){
  const code = (codeRaw||'').toUpperCase();

  db.collection('lives').doc(code).get().then(doc=>{
    if(!doc.exists || doc.data().active===false){
      main.innerHTML = '<div class="panel"><div class="empty">Ce live est terminé ou n\'existe pas. <a href="#live">← Retour</a></div></div>';
      return;

    const live = doc.data();
    const isHost = currentUser.uid === live.hostUid;

    main.innerHTML = `

          </div>
        </div>
      </div>`;

    const controls = document.getElementById('liveControls');
    const videoEl = document.getElementById('liveVideo');
    const peers = {};
    let localStream = null;
    let broadcastOn = !!(currentUser.liveActive && currentUser.liveCode===code);

    const chatUn = db.collection('lives').doc(code).collection('chat').orderBy('createdAt','asc').limit(200)
      .onSnapshot(snap=>{
        const box = document.getElementById('liveChatBox');
        if(!box) return;
        box.innerHTML = '';
        snap.forEach(d=>{
          const m = d.data();
          const el = document.createElement('div');
          el.className = 'live-chat-msg';
          el.innerHTML = '<b>'+esc(m.pseudo)+'</b>'+esc(m.text);
          box.appendChild(el);
        });
        box.scrollTop = box.scrollHeight;
      });
    unsubscribers.push(chatUn);

    const sendLiveChat = async ()=>{
      const input = document.getElementById('liveChatInput');

      input.value = '';
      await db.collection('lives').doc(code).collection('chat').add({

    unsubscribers.push(liveDocUn);

    function copyCode(){
      navigator.clipboard?.writeText(code).then(()=> toast('Code copié : '+code)).catch(()=> toast('Code : '+code));
    }

    async function toggleBroadcast(){
      broadcastOn = !broadcastOn;
      if(broadcastOn){
        await db.collection('users').doc(currentUser.uid).update({liveActive:true, liveCode:code});
        currentUser.liveActive = true; currentUser.liveCode = code;
        toast('Ton code de live est affiché sur ton profil.');
      }else{
        await db.collection('users').doc(currentUser.uid).update({liveActive:false});
        currentUser.liveActive = false;
        toast('Live retiré de ton profil.');
      }
      renderControls();
    }

    async function endLive(){
      await db.collection('lives').doc(code).update({active:false});
      if(currentUser.liveCode===code){
        await db.collection('users').doc(currentUser.uid).update({liveActive:false});
        currentUser.liveActive = false;
      }
      location.hash = '#live';
    }

    async function leaveLive(){
      await db.collection('lives').doc(code).collection('viewers').doc(currentUser.uid).delete().catch(()=>{});
      await db.collection('lives').doc(code).update({viewerCount: firebase.firestore.FieldValue.increment(-1)}).catch(()=>{});
      location.hash = '#live';
    }

    function renderControls(){
      controls.innerHTML = '';
      if(isHost){
        const copyBtn = document.createElement('button');
        copyBtn.className='secondary'; copyBtn.textContent='Copier le code';
        copyBtn.onclick = copyCode;
        controls.appendChild(copyBtn);

        const bcBtn = document.createElement('button');
        bcBtn.className='secondary';
        bcBtn.textContent = broadcastOn ? 'Retirer de mon profil' : 'Diffuser le code sur mon profil';
        bcBtn.onclick = toggleBroadcast;
        controls.appendChild(bcBtn);

        const endBtn = document.createElement('button');
        endBtn.className='danger'; endBtn.textContent='Terminer le live';
        endBtn.onclick = endLive;
        controls.appendChild(endBtn);
      }else{
        const leaveBtn = document.createElement('button');
        leaveBtn.className='secondary'; leaveBtn.textContent='Quitter le live';
        leaveBtn.onclick = leaveLive;
        controls.appendChild(leaveBtn);
      }
    }
    renderControls();

    let cleaned = false;
    function cleanup(){
      if(cleaned) return; cleaned = true;
      Object.values(peers).forEach(pc=>{ try{ pc.close(); }catch(e){} });
      if(localStream) localStream.getTracks().forEach(t=>t.stop());
    }
    unsubscribers.push(cleanup);

    if(isHost){
      navigator.mediaDevices.getUserMedia({video:true, audio:true}).then(stream=>{
        localStream = stream;
        videoEl.srcObject = stream;
      }).catch(err=>{
        toast("Impossible d'accéder à la caméra : "+err.message);
      });

      function setupPeerForViewer(viewerUid){
        if(peers[viewerUid]) return;
        const pc = new RTCPeerConnection(RTC_CONFIG);
        peers[viewerUid] = pc;
        if(localStream) localStream.getTracks().forEach(t=> pc.addTrack(t, localStream));
        const viewerRef = db.collection('lives').doc(code).collection('viewers').doc(viewerUid);
        pc.onicecandidate = e=>{
          if(e.candidate) viewerRef.collection('hostCandidates').add(e.candidate.toJSON());
        };
        pc.createOffer().then(offer=> pc.setLocalDescription(offer)).then(()=>{
          viewerRef.update({offer: {type: pc.localDescription.type, sdp: pc.localDescription.sdp}});
        });
        const un1 = viewerRef.onSnapshot(snap=>{
          const data = snap.data();
          if(data && data.answer && !pc.currentRemoteDescription){
            pc.setRemoteDescription(new RTCSessionDescription(data.answer));
          }
        });
        const un2 = viewerRef.collection('viewerCandidates').onSnapshot(snap=>{
          snap.docChanges().forEach(ch=>{
            if(ch.type==='added') pc.addIceCandidate(new RTCIceCandidate(ch.doc.data())).catch(()=>{});
          });
        });
        unsubscribers.push(un1, un2);
      }

      const viewersUn = db.collection('lives').doc(code).collection('viewers').onSnapshot(snap=>{
        snap.docChanges().forEach(ch=>{
          if(ch.type==='added') setupPeerForViewer(ch.doc.id);
          if(ch.type==='removed' && peers[ch.doc.id]){ peers[ch.doc.id].close(); delete peers[ch.doc.id]; }
        });
      });
      unsubscribers.push(viewersUn);

    }else{
      const viewerRef = db.collection('lives').doc(code).collection('viewers').doc(currentUser.uid);
      const pc = new RTCPeerConnection(RTC_CONFIG);
      peers[currentUser.uid] = pc;
      pc.ontrack = e=>{ videoEl.srcObject = e.streams[0]; };
      pc.onicecandidate = e=>{
        if(e.candidate) viewerRef.collection('viewerCandidates').add(e.candidate.toJSON());
      };
      viewerRef.set({uid: currentUser.uid, pseudo: currentUser.pseudo, joinedAt: firebase.firestore.FieldValue.serverTimestamp()})
        .then(()=> db.collection('lives').doc(code).update({viewerCount: firebase.firestore.FieldValue.increment(1)}));

      const un1 = viewerRef.onSnapshot(snap=>{
        const data = snap.data();
        if(data && data.offer && !pc.currentRemoteDescription){
          pc.setRemoteDescription(new RTCSessionDescription(data.offer)).then(()=> pc.createAnswer())
            .then(answer=> pc.setLocalDescription(answer)).then(()=>{
              viewerRef.update({answer: {type: pc.localDescription.type, sdp: pc.localDescription.sdp}});
            });
        }
      });
      const un2 = viewerRef.collection('hostCandidates').onSnapshot(snap=>{
        snap.docChanges().forEach(ch=>{
          if(ch.type==='added') pc.addIceCandidate(new RTCIceCandidate(ch.doc.data())).catch(()=>{});
        });
      });
      unsubscribers.push(un1, un2);
    }
  }).catch(err=>{
    main.innerHTML = '<div class="panel"><div class="empty">Erreur : '+esc(err.message)+'</div></div>';
  });
}
</script>
</body>
</html>
